# From Beranda to Kurikulum, the longest plain list (jank.sh scrolls it after): Profil → Kurikulum from round 4's app,
# Lainnya → Rencana studi → its Kurikulum tab on round 1's, so both builds reach the same list.
appId: io.github.pablonification.edunexplus.demo
---
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 60000
- tapOn:
    id: 'tab\.(profile|more)'
- runFlow:
    when:
      visible:
        id: row.profile.curriculum
    commands:
      - tapOn:
          id: row.profile.curriculum
      - extendedWaitUntil:
          visible:
            id: screen.plan.curriculum
          timeout: 20000
- runFlow:
    when:
      visible:
        id: row.profile.planner
    commands:
      - tapOn:
          id: row.profile.planner
      - extendedWaitUntil:
          visible:
            id: screen.plan
          timeout: 20000
      - tapOn:
          id: tab.plan.curriculum
- waitForAnimationToEnd
