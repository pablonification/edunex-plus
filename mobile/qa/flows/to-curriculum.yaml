# From Beranda to Kurikulum, the longest plain list (jank.sh scrolls it after): Profil → Kurikulum on the super-app layout's app,
# Akademik → Kurikulum on round 2's (today's), so both builds reach the same list. Round 1's way (Lainnya → Rencana studi →
# its Kurikulum tab) is gone: that build isn't compared any more.
appId: io.github.pablonification.edunexplus.demo
---
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 60000
- tapOn:
    id: 'tab\.(profile|academic)'
- tapOn:
    id: row.nav.plan.curriculum
- extendedWaitUntil:
    visible:
      id: screen.plan.curriculum
    timeout: 20000
- waitForAnimationToEnd
