# Round 3, job 5: grades.
#
# READ-ONLY: it taps the Akademik tab and the way to Nilai. Never a target, a grade's sheet, the
# planner, or "Buka SIX".
#
# Tap budget: 2 (Akademik, Nilai). Taps here: 2. Nilai is the IPK card when SIX gave a transcript,
# else the "Nilai" row under it.
appId: io.github.pablonification.edunexplus
name: "r3 5 grades"
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: screen.home
    timeout: 60000
- tapOn:
    id: tab.profile
    label: "tap: Akademik tab"
- extendedWaitUntil:
    visible:
      id: screen.profile
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: academic.loading
    timeout: 60000
- runFlow:
    when:
      visible:
        id: action.academic.grades
    commands:
      - tapOn:
          id: action.academic.grades
          label: "tap: the IPK card"
      - extendedWaitUntil:
          visible:
            id: screen.grades
          timeout: 5000
          optional: true
- runFlow:
    when:
      notVisible:
        id: screen.grades
    commands:
      - scrollUntilVisible:
          element:
            id: row.nav.grades
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: row.nav.grades
          label: "tap: Nilai"
- extendedWaitUntil:
    visible:
      id: screen.grades
    timeout: 20000
