# v4's pictures of Tugas, a Task and an exam (shots.sh), from a cleared app, in ${THEME}. Branch
# mobile-r2-tasks-academic (mobile/qa/v4-rollout.md, "Pictures and proof").
appId: io.github.pablonification.edunexplus.demo
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_THEME=${THEME}"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- tapOn:
    id: tab.tasks
- waitForAnimationToEnd
- takeScreenshot: 01-tugas
- scroll
- waitForAnimationToEnd
- takeScreenshot: 02-tugas-scrolled
- tapOn:
    id: tab.tasks
- tapOn:
    id: segment.show.done
- waitForAnimationToEnd
- takeScreenshot: 03-tugas-selesai
- tapOn:
    id: segment.show.open
- scrollUntilVisible:
    element:
      id: row.task.117003
- tapOn:
    id: row.task.117003
- waitForAnimationToEnd
- takeScreenshot: 04-tugas-detail
- scrollUntilVisible:
    element:
      id: action.attach
    centerElement: true
- takeScreenshot: 05-tugas-jawaban
- back
- scrollUntilVisible:
    element:
      id: row.exam.DK4073-UTS
    direction: UP
- tapOn:
    id: row.exam.DK4073-UTS
- waitForAnimationToEnd
- takeScreenshot: 06-ujian
- scroll
- waitForAnimationToEnd
- takeScreenshot: 07-ujian-scrolled
