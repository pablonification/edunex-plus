# Flashlight's iteration (flashlight.sh): start from saved data, scroll Tugas, go through every tab. The tabs' ids
# match round 2's app (Kuliah, Akademik) and the super-app layout's (Kuliah, Profil), so both builds run the same flow.
appId: io.github.pablonification.edunexplus.demo
---
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_RESUME=1"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 60000
- tapOn:
    id: tab.tasks
- scroll
- scroll
- scroll
- tapOn:
    id: tab.schedule
- tapOn:
    id: tab.courses
- tapOn:
    id: 'tab\.(profile|academic)'
- tapOn:
    id: tab.home
