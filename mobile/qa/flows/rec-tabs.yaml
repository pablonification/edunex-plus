# Recording: through every tab and back to Beranda (round 1's tabs or round 2's).
appId: io.github.pablonification.edunexplus.demo
---
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 60000
- tapOn:
    id: tab.tasks
- tapOn:
    id: tab.schedule
- tapOn:
    id: 'tab\.(courses|presence)'
- tapOn:
    id: 'tab\.(profile|more)'
- tapOn:
    id: tab.home
- waitForAnimationToEnd
