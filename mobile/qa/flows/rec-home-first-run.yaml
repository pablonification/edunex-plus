# Recording (qa-media/mobile-r2-home/): the first run, from the welcome to Beranda filling in and its summary card.
appId: io.github.pablonification.edunexplus.demo
---
- clearState
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=first-run&EDUNEX_DEMO_THEME=${THEME}"
- extendedWaitUntil:
    visible:
      id: action.signIn
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: action.signIn
- extendedWaitUntil:
    notVisible:
      id: screen.firstMinute
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.firstRead
    timeout: 120000
# Beranda draws no summary card any more: the first read ends in a snackbar, "Semua siap" with "Lihat ringkasan". While it is
# up, the recording opens the summary from it; else from Settings (Profil, the gear, "Ringkasan awal").
- runFlow:
    when:
      visible: "Lihat ringkasan"
    commands:
      - tapOn: "Lihat ringkasan"
- runFlow:
    when:
      notVisible:
        id: screen.firstScan
    commands:
      - tapOn:
          id: tab.profile
      - extendedWaitUntil:
          visible:
            id: screen.profile
          timeout: 10000
      - tapOn:
          id: action.settings
      - extendedWaitUntil:
          visible:
            id: screen.settings
          timeout: 10000
      - scrollUntilVisible:
          element:
            id: action.firstScan
          direction: DOWN
          timeout: 20000
          centerElement: true
      - tapOn:
          id: action.firstScan
- extendedWaitUntil:
    visible:
      id: screen.firstScan
    timeout: 30000
- waitForAnimationToEnd
- back
