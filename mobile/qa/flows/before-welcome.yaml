# The first run's pictures (shots.sh), in ${THEME}: the stage before the tap, the button turned status after it, and
# Beranda once the stage has handed over. (Round 1's three-step deck, which this flow first pictured, is gone: no
# Mulai, no Hubungkan, no Lanjut.)
appId: io.github.pablonification.edunexplus.demo
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=first-run&EDUNEX_DEMO_THEME=${THEME}"
- extendedWaitUntil:
    visible:
      id: action.signIn
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: selamat-datang
- tapOn:
    id: action.signIn
- extendedWaitUntil:
    visible:
      id: status.signIn
    timeout: 30000
- takeScreenshot: selamat-datang-hubungkan
- extendedWaitUntil:
    notVisible:
      id: screen.firstMinute
    timeout: 180000
- waitForAnimationToEnd
- takeScreenshot: selamat-datang-terhubung
