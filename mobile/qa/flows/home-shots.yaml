# Pictures of Beranda (round 2, v4) and the first run (mobile/report/img/mobile-r2-home/), through the lab's shots.sh
# (${THEME}).
appId: io.github.pablonification.edunexplus.demo
---
# The first run: the welcome, Beranda filling in, the summary card.
- clearState
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=first-run&EDUNEX_DEMO_THEME=${THEME}"
- extendedWaitUntil:
    visible:
      id: action.signIn
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-welcome
- tapOn:
    id: action.signIn
- extendedWaitUntil:
    notVisible:
      id: screen.firstMinute
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: status.firstRead
    timeout: 30000
    optional: true
- takeScreenshot: 02-beranda-filling
- extendedWaitUntil:
    notVisible:
      id: status.firstRead
    timeout: 600000
# Beranda draws no summary card any more: the first read ends in a snackbar, "Semua siap" with "Lihat ringkasan". Its picture
# is the snackbar over Beranda; where it isn't up (the other child's part isn't in this build), Beranda settled.
- extendedWaitUntil:
    visible: "Lihat ringkasan"
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 03-summary-card
# Signed in, Thursday 08:07, SIX's Tandai Hadir open in the morning's class.
- clearState
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_CHECK_IN=open&EDUNEX_DEMO_THEME=${THEME}"
- extendedWaitUntil:
    visible:
      id: home.now
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- tapOn:
    id: action.notify.later
    optional: true
- scrollUntilVisible:
    element:
      id: action.checkIn
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 04-beranda-tandai-hadir
- tapOn:
    id: action.nowClass
- extendedWaitUntil:
    visible:
      id: sheet.nowClass
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 05-sheet-kelas
- back
- scrollUntilVisible:
    element:
      id: section.today
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 06-beranda-nanti
- scrollUntilVisible:
    element:
      id: action.checkIn
    direction: UP
    timeout: 10000
# After Tandai Hadir: the demo's pretend SIX page counts as pressed; SIX's next read (every 2 minutes in class) shows it.
- tapOn:
    id: action.checkIn
- waitForAnimationToEnd
- back
- extendedWaitUntil:
    visible:
      id: card.now.checkedIn
    timeout: 200000
- waitForAnimationToEnd
- takeScreenshot: 07-beranda-sudah-ke-six
# Perlu kamu urus's screen, a swipe and its snackbar, Ingatkan nanti's times.
- tapOn:
    id: action.needs.all
- extendedWaitUntil:
    visible:
      id: screen.needs
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 08-perlu-kamu-urus
- swipe:
    from:
      id: "row.need.attendance:KU5014:out"
    direction: RIGHT
    duration: 300
- takeScreenshot: 09-swipe-urungkan
- tapOn: "Urungkan"
- extendedWaitUntil:
    notVisible: "Urungkan"
    timeout: 10000
- swipe:
    from:
      id: "row.need.exam:DK4073-UTS"
    direction: LEFT
    duration: 300
- extendedWaitUntil:
    visible:
      id: sheet.snooze
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 10-swipe-ingatkan-nanti
- back
