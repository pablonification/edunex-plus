# Beranda in use (mobile/qa/home-notes.md): the now card's sheet three times, a Hari ini class's sheet twice, Yang
# berubah's sheet, Perlu perhatianmu's whole list twice (a screen open), and a swipe that commits, then Urungkan.
appId: io.github.pablonification.edunexplus.demo
---
- tapOn:
    id: tab.home
- repeat:
    times: 3
    commands:
      - tapOn:
          id: action.nowClass
      - extendedWaitUntil:
          visible:
            id: sheet.nowClass
          timeout: 10000
      - back
- scrollUntilVisible:
    element:
      id: "row.today.class:2153983"
    direction: DOWN
    centerElement: true
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "row.today.class:2153983"
      - extendedWaitUntil:
          visible:
            id: sheet.nowClass
          timeout: 10000
      - back
- scrollUntilVisible:
    element:
      id: action.changes
    direction: DOWN
- tapOn:
    id: action.changes
- extendedWaitUntil:
    visible:
      id: sheet.changes
    timeout: 10000
- back
- scrollUntilVisible:
    element:
      id: "row.need.attendance:KU5014:out"
    direction: UP
    centerElement: true
- swipe:
    from:
      id: "row.need.attendance:KU5014:out"
    direction: RIGHT
    duration: 300
- tapOn: "Urungkan"
- scrollUntilVisible:
    element:
      id: section.needs
    direction: UP
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "row.need.exam:DK4073-UTS"
      - waitForAnimationToEnd
      - back
