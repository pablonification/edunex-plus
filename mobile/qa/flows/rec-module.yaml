# Recording: a course from Lainnya, its Modul tab, a module, then a file in it.
appId: io.github.pablonification.edunexplus.demo
---
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 60000
- tapOn:
    id: tab.more
- scrollUntilVisible:
    element:
      id: row.course.PL3002
    direction: DOWN
- tapOn:
    id: row.course.PL3002
- extendedWaitUntil:
    visible:
      id: screen.course
    timeout: 20000
- tapOn:
    id: tab.course.modules
    optional: true
- tapOn:
    id: "row\.module\..*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: modul
- tapOn:
    id: "row\.material\..*"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: modul-berkas
