# The phone's pictures for the same-feel judge (check B in mobile/PROGRESS.md): each screen in the state
# the desktop demo's own pictures show it (scripts/demo/capture.mjs), named like them, with the theme
# in front ("light-01-beranda"). Run through judge-light.yaml and judge-dark.yaml. The desktop's
# 05 (a file dropped on the hand-in) needs the phone's file picker, 27 (offline) a phone without a
# network, and 31 the English app: left out here. The first run (32-35) and Edunex alone (36-37) are
# judge/first-run.yaml and judge/edunex-only.yaml.
appId: io.github.pablonification.edunexplus.demo
---
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-01-beranda
# Beranda's lower half: the rest of today, what needs you, what changed.
- scrollUntilVisible:
    element:
      text: "Yang berubah"
    direction: DOWN
    centerElement: true
    optional: true
- takeScreenshot: ${THEME}-02-beranda-hari-ini

# Tugas & Ujian, a Task, an exam
- tapOn:
    id: tab.tasks
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-03-tugas-ujian
- scrollUntilVisible:
    element:
      id: row.task.117003
    direction: DOWN
- tapOn:
    id: row.task.117003
- extendedWaitUntil:
    visible:
      id: screen.task
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-04-tugas
# The hand-in below the instructions: the answer, the files, the note for the lecturer, Riwayat.
- scrollUntilVisible:
    element:
      id: action.attach
    direction: DOWN
    centerElement: true
    optional: true
- takeScreenshot: ${THEME}-04b-tugas-kumpulkan
- tapOn:
    id: action.back
- tapOn:
    id: tab.tasks
# The exam is near the top of the list (the tab's tap brought it back up): no scroll, which at the top would refresh.
- tapOn:
    id: row.exam.DK4073-UTS
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-06-ujian
- tapOn:
    id: action.back

# Jadwal: the week, a class, the week of the midterms, the month, the phone's calendar
- tapOn:
    id: tab.schedule
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-07-jadwal-minggu
- scrollUntilVisible:
    element:
      id: "row\\.class\\.KU5014.*"
    direction: DOWN
    optional: true
- tapOn:
    id: "row\\.class\\.KU5014.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-08-jadwal-detail
- pressKey: back
- scrollUntilVisible:
    element:
      id: action.nextWeek
    direction: UP
    optional: true
- tapOn:
    id: action.nextWeek
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-09-jadwal-masa-uts
- tapOn:
    id: segment.view.month
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-10-jadwal-bulan
- tapOn:
    id: segment.view.week
- scrollUntilVisible:
    element:
      id: action.addToCalendar
    direction: DOWN
    optional: true
- tapOn:
    id: action.addToCalendar
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-11-ekspor-kalender
- scrollUntilVisible:
    element:
      id: action.addToCalendar.confirm
    direction: DOWN
    optional: true
- tapOn:
    id: action.addToCalendar.confirm
    optional: true
# Android asks for the calendar once.
- tapOn:
    text: "(Allow|Izinkan|ALLOW|IZINKAN)"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-12-ekspor-kalender-selesai
- pressKey: back

# Presensi
- tapOn:
    id: tab.presence
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-13-presensi

# Nilai and Rencana studi, from Lainnya
- tapOn:
    id: tab.more
- tapOn:
    id: row.nav.grades
- extendedWaitUntil:
    visible:
      id: screen.grades
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-14-nilai
- tapOn:
    id: action.back
- tapOn:
    id: row.nav.plan
- extendedWaitUntil:
    visible:
      id: screen.plan
    timeout: 20000
- tapOn:
    id: tab.plan.planner
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-15-rencana
- tapOn:
    id: tab.plan.curriculum
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-16-kurikulum
- tapOn:
    id: tab.plan.krs
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-17-krs
- tapOn:
    id: tab.plan.bills
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-18-ukt
- tapOn:
    id: tab.plan.deadlines
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-19-kalender-akademik
- tapOn:
    id: action.back

# A course: its page, its meetings, its grade calculator
- scrollUntilVisible:
    element:
      id: row.course.PL3002
    direction: DOWN
- tapOn:
    id: row.course.PL3002
- extendedWaitUntil:
    visible:
      id: screen.course
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-20-mata-kuliah
- tapOn:
    id: tab.course.meetings
- scrollUntilVisible:
    element:
      id: "row\\.meeting\\..*"
    direction: DOWN
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-21-pertemuan
- tapOn:
    id: tab.course.grades
# The calculator itself, under the course's header.
- scrollUntilVisible:
    element:
      id: "row\\.gradePart\\..*"
    direction: DOWN
    centerElement: true
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-22-kalkulator-nilai
- tapOn:
    id: action.back

# Search, the data's state while it's read again, the bell
- tapOn:
    id: tab.home
- tapOn:
    id: action.search
# The desktop's own search, for the same results.
- inputText: "bab 2"
- hideKeyboard
- takeScreenshot: ${THEME}-23-cari
- tapOn:
    id: action.back
# A new Task on the pretend Edunex, as the desktop demo's pictures have it here: the read below finds it, and the bell
# then has an unread alert (the link goes to Beranda).
- openLink: "edunexplusdemo://demo?post=kuis"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 20000
- tapOn:
    id: action.syncStatus
- tapOn:
    id: action.refreshNow
    optional: true
- takeScreenshot: ${THEME}-24-status-data-memperbarui
- pressKey: back
- tapOn:
    id: action.alerts
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-25-notifikasi
- tapOn:
    id: action.back

# Lainnya, then Settings: the top, notifications, about, the licences
- tapOn:
    id: tab.more
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-lainnya
- scrollUntilVisible:
    element:
      id: row.nav.settings
    direction: DOWN
- tapOn:
    id: row.nav.settings
- extendedWaitUntil:
    visible:
      id: screen.settings
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-26-pengaturan
- scrollUntilVisible:
    element:
      id: action.testAlert
    direction: DOWN
    centerElement: true
    optional: true
- takeScreenshot: ${THEME}-26-pengaturan-notifikasi
- scrollUntilVisible:
    element:
      id: action.licences
    direction: DOWN
    centerElement: true
    optional: true
- takeScreenshot: ${THEME}-26-pengaturan-tentang
- tapOn:
    id: action.licences
- waitForAnimationToEnd
- takeScreenshot: ${THEME}-26-pengaturan-lisensi
- tapOn:
    id: action.back
    optional: true
