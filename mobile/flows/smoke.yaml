# The demo app installs, opens on its made-up student, and shows Beranda with its tabs.
appId: io.github.pablonification.edunexplus.demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- assertVisible:
    id: screen.home
# v4's Beranda: the greeting with the demo student's name, and the class on now from the demo's timetable.
- assertVisible: "(Pagi|Siang|Sore|Malam), Dimas"
- assertVisible:
    id: card.now
- assertVisible: "Ekonomi dan Inovasi dalam Perencanaan"
- takeScreenshot: smoke
