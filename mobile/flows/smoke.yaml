# The demo app installs, opens on its made-up student, and shows Beranda with its tabs.
appId: io.github.pablonification.edunexplus.demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- assertVisible:
    id: screen.home
# The super-app layout's Beranda (mobile/qa/superapp-decisions.md): the search bar, the class on now from the demo's
# timetable, the strip about the Student and the service grid. There is no greeting any more (the search bar took its
# place as the first thing), so it isn't asserted.
- assertVisible:
    id: home.search
- assertVisible:
    id: home.now
- assertVisible: "Ekonomi dan Inovasi dalam Perencanaan"
- assertVisible:
    id: home.strip
- assertVisible:
    id: home.grid
- takeScreenshot: smoke
