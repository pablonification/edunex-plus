# The demo app installs, opens on its made-up student, and shows Beranda with its tabs.
appId: io.github.pablonification.edunexplus.demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- assertVisible:
    id: screen.home
- assertVisible: ".*Kamis, 8 Oktober.*"
- takeScreenshot: smoke
