# The Student uses the app, not only looks at it: each step does something and checks what it did, the proof
# for the scope rows in mobile/PROGRESS.md (S3, S5-S7, S9, A17). On the demo's made-up student: nothing
# leaves the phone. Its pictures are "use-*".
appId: io.github.pablonification.edunexplus.demo
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000

# S3: the Task marked as handed in another way, and that undone; then an answer and a file from Android's own picker
# (mobile/flows/files/jawaban.pdf, put in Downloads by scripts/ci/mobile-e2e.sh), kept as a draft and handed in.
- tapOn:
    id: tab.tasks
- scrollUntilVisible:
    element:
      id: row.task.117003
    direction: DOWN
- tapOn:
    id: row.task.117003
- extendedWaitUntil:
    visible:
      id: screen.task
    timeout: 20000
- scrollUntilVisible:
    element:
      id: action.markHandled
    direction: DOWN
    centerElement: true
- tapOn:
    id: action.markHandled
- tapOn:
    id: handled.handedElsewhere
- extendedWaitUntil:
    visible:
      id: action.unmarkHandled
    timeout: 10000
- takeScreenshot: use-03-handled
- tapOn:
    id: action.unmarkHandled
- scrollUntilVisible:
    element:
      id: input.answer
    direction: UP
    centerElement: true
- tapOn:
    id: input.answer
- inputText: "Jawaban sementara"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: action.attach
    direction: DOWN
    centerElement: true
- tapOn:
    id: action.attach
- extendedWaitUntil:
    visible: "jawaban.pdf"
    timeout: 20000
- tapOn: "jawaban.pdf"
- extendedWaitUntil:
    visible: "Belum disimpan.*"
    timeout: 20000
- tapOn:
    id: action.saveDraft
# Saved: the answer card says so ("Tersimpan hari ini, 08:11 · belum diserahkan"); the hint over Kumpulkan is gone (round 2).
- extendedWaitUntil:
    visible: "Tersimpan .*"
    timeout: 20000
- takeScreenshot: use-04-draft
- tapOn:
    id: action.submit
- extendedWaitUntil:
    visible: "Kumpulkan tugas ini\\?"
    timeout: 10000
- takeScreenshot: use-04-confirm
# Presensi isn't open on the demo's day: handed in anyway, not counted as present (the sheet says so).
- tapOn:
    id: action.submitAnyway
# Handed in: the Task's status line, at the page's top, now says when Edunex recorded it (its spoken label starts
# "Edunex mencatatnya hari ini, 08:11 · …"). Not the "Terkumpul" flash over the page: it stays two seconds, and the
# emulator looked once after its title had gone and once after its line had (runs 43213292291 and 43224561172).
- scrollUntilVisible:
    element:
      id: card.due
    direction: UP
- extendedWaitUntil:
    visible: "Edunex mencatatnya hari ini, .*"
    timeout: 20000
- takeScreenshot: use-04-submitted
- tapOn:
    id: action.back

# S5, S7: a class's sheet from the day, then next week (v4's Jadwal: a swipe across the week strip) and back with Hari
# ini.
- tapOn:
    id: tab.schedule
- extendedWaitUntil:
    visible:
      id: row.class.dk4073-11-00
    timeout: 20000
- tapOn:
    id: row.class.dk4073-11-00
- extendedWaitUntil:
    visible: "TVST C"
    timeout: 10000
- takeScreenshot: use-08-class-sheet
- back
# The bar's line under Jadwal is "<month> · Minggu ke-<n>" (src/screens/schedule/schedule-screen.tsx, `label.place`), and
# a Maestro text is matched whole: the week is asked for at the end of the line. The demo's today is Thursday 8 October,
# week 7, so the next is week 8 (still October). The strip moves a week on a swipe of 48 dp or more
# (src/screens/schedule/strip.tsx); if it didn't take, the month's "Lihat minggunya" on the 15th shows the same week.
- swipe:
    from:
      id: strip.week
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: label.place
      text: ".*Minggu ke-8"
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: label.place
        text: ".*Minggu ke-8"
    commands:
      - tapOn:
          id: action.month
      - tapOn:
          id: day.2026-10-15
      - scrollUntilVisible:
          element:
            id: action.showWeek
          direction: DOWN
      - tapOn:
          id: action.showWeek
- extendedWaitUntil:
    visible:
      id: label.place
      text: ".*Minggu ke-8"
    timeout: 10000
- tapOn:
    id: action.today
- extendedWaitUntil:
    visible:
      id: label.place
      text: ".*Minggu ke-7"
    timeout: 5000

# S6: the month (its own screen, its own icon in the top bar), a day picked in it lists that day.
- tapOn:
    id: action.month
- extendedWaitUntil:
    visible:
      id: screen.month
    timeout: 10000
- tapOn:
    id: day.2026-10-15
- extendedWaitUntil:
    visible: "Kamis, 15 Oktober"
    timeout: 10000
- takeScreenshot: use-10-month-day
- back

# S9: Kuliah's course opens its page.
- tapOn:
    id: tab.courses
- scrollUntilVisible:
    element:
      id: row.course.DK4073
    direction: DOWN
- tapOn:
    id: row.course.DK4073
- extendedWaitUntil:
    visible:
      id: screen.course
    timeout: 20000
- assertVisible: "Komunikasi Pemasaran"
- tapOn:
    id: action.back

# A17: Settings in English and dark, then back as it was. Each choice waits to show as chosen: the whole app draws
# again on a theme or language change, and a tap in the middle of that is lost. Settings is behind Profil's "Akun" rows (no
# avatar in a top bar any more): Profil tab, then its Settings row.
- tapOn:
    id: tab.profile
- extendedWaitUntil:
    visible:
      id: screen.profile
    timeout: 10000
- scrollUntilVisible:
    element:
      id: action.account
    direction: DOWN
    centerElement: true
- tapOn:
    id: action.account
- extendedWaitUntil:
    visible:
      id: screen.settings
    timeout: 20000
- scrollUntilVisible:
    element:
      id: segment.lang
    direction: DOWN
    centerElement: true
# Bahasa and Tema are rows showing their value; each opens its choices in a sheet, which closes on a pick.
- tapOn:
    id: segment.lang
- tapOn:
    id: segment.lang.en
- extendedWaitUntil:
    visible:
      id: segment.lang
      text: ".*English.*"
    timeout: 10000
- assertVisible: "Settings"
- tapOn:
    id: segment.theme
- tapOn:
    id: segment.theme.dark
- extendedWaitUntil:
    visible:
      id: segment.theme
      text: ".*Dark.*"
    timeout: 10000
- takeScreenshot: use-26-english-dark
- tapOn:
    id: segment.lang
- tapOn:
    id: segment.lang.id
- extendedWaitUntil:
    visible:
      id: segment.lang
      text: ".*Indonesia.*"
    timeout: 10000
- tapOn:
    id: segment.theme
- tapOn:
    id: segment.theme.system
- extendedWaitUntil:
    visible:
      id: segment.theme
      text: ".*Sistem.*"
    timeout: 10000
- assertVisible: "Pengaturan"
