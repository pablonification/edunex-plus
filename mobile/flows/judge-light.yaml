# Pictures of every screen in the light theme, for the same-feel judge: the signed-in walk
# (judge/walk.yaml), the first run (judge/first-run.yaml) and Edunex alone (judge/edunex-only.yaml).
appId: io.github.pablonification.edunexplus.demo
tags:
  - judge
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_THEME=light"
- runFlow:
    file: judge/walk.yaml
    env:
      THEME: light
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=first-run&EDUNEX_DEMO_THEME=light"
- runFlow:
    file: judge/first-run.yaml
    env:
      THEME: light
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=edunex-only&EDUNEX_DEMO_THEME=light"
- runFlow:
    file: judge/edunex-only.yaml
    env:
      THEME: light
