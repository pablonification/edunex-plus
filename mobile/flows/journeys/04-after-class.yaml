# Journey 4, after class: this week's material for that course, opened.
# limit: 2
# Taps: Beranda's "Materi" tile (this week's material across courses), an item. A note opens its module; a file opens in the
# phone's own viewer and a link in the browser: the walk takes the first item the demo lists and goes as far as the app's own screen.
# unverified: which item is first in the demo's Materi, and so whether it opens screen.module (a note) or a viewer (a file).
appId: io.github.pablonification.edunexplus.demo
name: "journey 4 after class: Beranda, Materi, an item"
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_LANG=id"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: home.grid
    timeout: 30000
# tap 1: the grid's "Materi" tile.
- tapOn:
    id: action.service.material
- extendedWaitUntil:
    visible:
      id: screen.material
    timeout: 20000
# The tile's word is the screen's word.
- assertVisible: "Materi"
- extendedWaitUntil:
    visible:
      id: 'row\.material\..*'
    timeout: 30000
- takeScreenshot: journey-4-materi
# tap 2: an item; its module (the files and notes) opens, not a list again.
- tapOn:
    id: 'row\.material\..*'
    index: 0
- extendedWaitUntil:
    visible:
      id: screen.module
    timeout: 20000
# goal
- takeScreenshot: journey-4-module
# Back goes item -> Materi -> Beranda, one step each.
- back
- extendedWaitUntil:
    visible:
      id: screen.material
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: home.grid
    timeout: 10000
