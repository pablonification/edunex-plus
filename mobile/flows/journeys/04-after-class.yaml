# Journey 4, after class: this week's material for that course, opened.
# limit: 3
# Taps: Beranda's "Materi" tile, the row that opens the rest of "Sebelumnya", an item that opens the module it's in. In
# the demo (8 October) "Minggu ini" holds one item, the Teams link of TA's Pertemuan 03 (row.material.889385,
# test/fixtures/edunex course contents, created 5 Oct): a meeting link that leaves the app (found on the real phone).
# Nothing came last week, so the newest five of "Sebelumnya" follow it, open, and one row under them opens the rest
# (src/screens/material/feed.ts, feedLines). The walk opens the note "Link Penawaran Topik TA" (row.material.880001,
# II4091's module 450218, test/pretend/edunex-modules.ts, posted 28 Aug: the term's oldest, so in the rest): a note
# opens its module's screen (src/screens/material/material-screen.tsx, Item), so the journey stays inside the app.
# gap: the limit was 2 (an item of this week); in the demo's week the one new item is a meeting link and the five open
# under it are files and links, so a module's page is a third tap away.
appId: io.github.pablonification.edunexplus.demo
name: "journey 4 after class: Beranda, Materi, an item"
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_LANG=id"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: home.grid
    timeout: 30000
# tap 1: the grid's "Materi" tile.
- tapOn:
    id: action.service.material
- extendedWaitUntil:
    visible:
      id: screen.material
    timeout: 20000
# The tile's word is the screen's word.
- assertVisible: "Materi"
- extendedWaitUntil:
    visible:
      id: row.material.889385
    timeout: 30000
- takeScreenshot: journey-4-materi
# tap 2: the row under the newest five of "Sebelumnya": it opens the rest, and says how many.
- scrollUntilVisible:
    element:
      id: action.material.earlier
    direction: DOWN
    centerElement: true
- tapOn:
    id: action.material.earlier
- scrollUntilVisible:
    element:
      id: row.material.880001
    direction: DOWN
    centerElement: true
# tap 3: the note; its module (the files and notes) opens, not a list again.
- tapOn:
    id: row.material.880001
- extendedWaitUntil:
    visible:
      id: screen.module
    timeout: 20000
# goal
- takeScreenshot: journey-4-module
# Back goes item -> Materi -> Beranda, one step each.
- back
- extendedWaitUntil:
    visible:
      id: screen.material
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: home.grid
    timeout: 10000
