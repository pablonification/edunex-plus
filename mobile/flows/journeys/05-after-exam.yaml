# Journey 1, after an exam: my grade and what it does to my IPK. Budget: 2 taps (the "Nilai" tile, a course).
# Nilai opens on the IPK; this term's courses carry SIX's grade; a course opens its own page (its Nilai tab, the lecturer's grade).
appId: io.github.pablonification.edunexplus.demo
name: "journey 5 after an exam: Beranda, Nilai, a course"
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
# tap 1: the "Nilai" tile.
- tapOn:
    id: action.service.grades
- extendedWaitUntil:
    visible:
      id: screen.grades
    timeout: 20000
# The IPK, big, is the first thing.
- assertVisible:
    id: card.standing
- takeScreenshot: journey-5-nilai
# What the unfinished term does to the IPK sits under this term's courses.
- scrollUntilVisible:
    element:
      id: section.thisTerm
    direction: DOWN
    optional: true
# tap 2: a course of this term.
- scrollUntilVisible:
    element:
      id: 'row\.course\..*'
    direction: DOWN
- tapOn:
    id: 'row\.course\..*'
    index: 0
- extendedWaitUntil:
    visible:
      id: screen.course
    timeout: 20000
- takeScreenshot: journey-5-course
- back
- extendedWaitUntil:
    visible:
      id: screen.grades
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: home.grid
    timeout: 10000
