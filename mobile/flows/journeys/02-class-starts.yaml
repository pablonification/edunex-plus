# Journey 2, a class starts: from Beranda to presence marked, then back to "what's next".
# limit: 2
# The demo opens SIX's Tandai Hadir for the class on now (EDUNEX_DEMO_CHECK_IN=open). Its page in the demo is a placeholder
# ("Di aplikasi asli, halaman SIX terbuka di sini"): the Student's press of SIX's own button isn't ours, so the walk goes as far
# as is real: the button, SIX's page, Back to Beranda.
# gap: after Back the block still shows "Sudah ke SIX" on the same class; it does not move on to what's next (the hill's landing).
appId: io.github.pablonification.edunexplus.demo
name: "journey 2 a class starts: Isi Presensi, then what's next"
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in&EDUNEX_DEMO_LANG=id&EDUNEX_DEMO_CHECK_IN=open"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: status.settling
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: home.now
    timeout: 30000
- assertVisible: ".*Ekonomi dan Inovasi dalam Perencanaan.*"
# tap 1: the block's one white button (SIX's "Tandai Hadir" here: SIX is the one open; Edunex's is "Isi Presensi"). Its id is
# action.presence for an Edunex Presence and action.checkIn on the SIX path the block still draws, so both are taken.
- tapOn:
    id: 'action\.(presence|checkIn)'
# SIX's own page (the demo's placeholder). Our part ends here.
- extendedWaitUntil:
    visible:
      id: screen.checkIn
    timeout: 20000
- takeScreenshot: journey-2-six-page
# Back lands on Beranda, the card closed, no dead end.
- back
- extendedWaitUntil:
    visible:
      id: home.now
    timeout: 20000
# The block says it was done: a check and "Sudah ke SIX".
- assertVisible:
    id: card.now.checkedIn
- assertVisible: "Sudah ke SIX.*"
- assertVisible:
    id: home.strip
- assertVisible:
    id: home.grid
# goal
- takeScreenshot: journey-2-whats-next
# Not a dead end: the rest of Beranda still works (the strip opens Tugas, Back returns).
# return: the strip's Tugas, then Back to Beranda.
- tapOn:
    id: action.strip.tasks
- extendedWaitUntil:
    visible:
      id: screen.tasks
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: home.now
    timeout: 10000
