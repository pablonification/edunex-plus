# W4/W11 (PROGRESS.md): what to look at first is obvious, and the screens aren't crowded. A Task opens on its
# deadline (one card, no scrolling; its status is said once, in Jawabanmu), an exam on its day, time and room, Akademik on the IPK and SKS.
# Fails on round 1 (9395cea): its Task opened on the course line and the title, the deadline one line of many.
appId: io.github.pablonification.edunexplus.demo
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
- tapOn:
    id: tab.tasks
- assertVisible:
    id: segment.show.open
- scrollUntilVisible:
    element:
      id: row.task.117003
- tapOn:
    id: row.task.117003
- extendedWaitUntil:
    visible:
      id: screen.task
    timeout: 20000
# The deadline leads, in the first screenful, with whether late is still taken on its line.
- assertVisible:
    id: card.due
- assertVisible: ".*Jum, 16 Okt, 23:59.*"
- back
- scrollUntilVisible:
    element:
      id: row.exam.DK4073-UTS
- tapOn:
    id: row.exam.DK4073-UTS
- extendedWaitUntil:
    visible:
      id: screen.exam
    timeout: 20000
- assertVisible:
    id: 'card\.sitting\..*'
- assertVisible: ".*TVST C.*"
- back
- tapOn:
    id: tab.academic
- assertVisible:
    id: action.academic.grades
- assertVisible: "3,26"
