# W4/W11 on Kuliah (round 3, after the blind review): in three seconds, which course is at risk and the way in. The
# courses at risk come first (round 4: a grid of cards, no headings); each one card with one target (its tile, its
# name, its code, and at its end its absences in plain words: "Lewat batas 1×" and "Habis", "Sisa 1×"
# quiet; no meter, no tick, no links of its own); the row opens the course, where the meter, the count, the target and
# the one exception are. No explanatory sentence and no big number on the first screen: the day's answer and how it's
# counted are in ⋮, beside the targets.
# Round 1 (9395cea): no Kuliah tab, Presensi's long cards.
appId: io.github.pablonification.edunexplus.demo
name: "w11 Kuliah one row one target"
---
- clearState
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 120000
- tapOn:
    id: tab.courses
- extendedWaitUntil:
    visible:
      id: screen.courses
    timeout: 10000
# At risk first (round 4: a grid of course cards, no headings): the course out of reach heads the grid, its words say
# how far; then no absences left; then the rest.
- assertNotVisible: "Perlu perhatian"
- assertVisible:
    id: group.presence.out
- assertVisible:
    id: row.course.KU5014
- assertVisible:
    id: status.course.KU5014
- assertVisible: "Lewat batas 1×"
- assertVisible: "Habis"
- assertNotVisible:
    id: "meter.course.*"
- assertNotVisible:
    id: "mark.counted.*"
- assertNotVisible: ".*tak bisa lagi capai 80%.*"
- assertVisible:
    id: row.course.DK4073
- scrollUntilVisible:
    element:
      id: row.course.PL3002
    direction: DOWN
- assertNotVisible: "Aman"
# Today's clash: the row says when, and "Pilih kelas" opens the sheet that says which to go to.
- scrollUntilVisible:
    element: "Bentrok 16:00–16:30"
    direction: UP
- assertVisible: "Pilih kelas"
# One target per row: no links of their own on Kuliah, and no explanatory sentence on its first screen.
- assertNotVisible:
    id: action.checkSix
- assertNotVisible:
    id: "action.changeTarget.*"
- assertNotVisible: "Hari ini ada 4 kuliah.*"
- assertNotVisible: "Kehadiran dihitung di SIX.*"
- takeScreenshot: w11-1-kuliah
# ⋮'s "Cara menghitungnya": the day's answer, the target, how it's counted.
- tapOn:
    id: action.coursesMenu
- tapOn:
    id: action.howCounted
- extendedWaitUntil:
    visible:
      id: sheet.kuliahFacts
    timeout: 5000
- assertVisible: "Hari ini ada 4 kuliah. Hanya PL3002 yang masih ada jatah absen."
- assertVisible: "Target 80%"
- takeScreenshot: w11-2-facts
- back
# The row opens its course: its meter under the name; "Cek ke dosen" is advice, so it's in the sheet behind the header.
- tapOn:
    id: row.course.KU5014
- extendedWaitUntil:
    visible:
      id: screen.course
    timeout: 10000
- assertVisible:
    id: meter.courseAttendance
- assertVisible:
    id: mark.courseAdvice
- assertNotVisible: "Cek ke dosen"
# Pertemuan leads the tabs of a course at risk, every tab whole.
- assertVisible:
    id: tab.course.meetings
- takeScreenshot: w11-3-course
- back
# The targets, in ⋮.
- tapOn:
    id: action.coursesMenu
- tapOn:
    id: action.target
- extendedWaitUntil:
    visible: "Target umum"
    timeout: 5000
