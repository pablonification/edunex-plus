# W4/W11 on Kuliah (the super-app round, after round 1's council): in three seconds, which course is at risk and the
# way in. Read top to bottom: "Hari ini" (the class on now as a line in its colour with the one presence button, a
# clash), then "Semester ini": the courses at risk first, each one card with one target (its name whole, its state in
# glyph, its absences as dots and one short label, "lewat 1", a chevron; no count, no links of its own). The card opens
# the course, where the count, the target and the one exception are. No explanatory sentence on the first screen: the
# day's answer and how it's counted are in ⋮, beside the targets.
# Round 1 (9395cea): no Kuliah tab, Presensi's long cards.
appId: io.github.pablonification.edunexplus.demo
name: "w11 Kuliah one row one target"
---
- clearState
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 120000
- tapOn:
    id: tab.courses
- extendedWaitUntil:
    visible:
      id: screen.courses
    timeout: 10000
# What's on today leads, under its heading: the Presence open now, in the course's colour, with the one button.
- assertVisible: "Hari ini"
- assertVisible:
    id: card.presenceOpen.PL3002
- assertVisible:
    id: action.presence
- assertVisible: "Ekonomi dan Inovasi dalam Perencanaan"
# Then the courses, at risk first: the course out of reach heads the list, its words and its count say how far.
- assertVisible: "Semester ini"
- assertVisible:
    id: row.course.KU5014
- assertVisible:
    id: status.course.KU5014
- assertVisible: "lewat 1"
- assertVisible: "habis"
- assertNotVisible: "4 dari 3 absen"
- assertNotVisible:
    id: "meter.course.*"
- assertNotVisible:
    id: "mark.counted.*"
- assertNotVisible: ".*tak bisa lagi capai 80%.*"
- assertVisible:
    id: row.course.DK4073
    below:
      id: row.course.KU5014
- assertVisible:
    id: row.course.PL3002
    below:
      id: row.course.PL3032
# Today's clash: the one clash sign with its time; which to go to and why is one tap deeper.
- assertVisible: "Bentrok 16:00–16:30"
- assertVisible:
    id: "row.clash.*"
# One target per row: no links of their own on Kuliah, and no explanatory sentence on its first screen.
- assertNotVisible:
    id: action.checkSix
- assertNotVisible:
    id: "action.changeTarget.*"
- assertNotVisible: "Hari ini ada 4 kuliah.*"
- assertNotVisible: "Kehadiran dihitung di SIX.*"
- takeScreenshot: w11-1-kuliah
# ⋮'s "Cara menghitungnya": the day's answer, the target, how it's counted.
- tapOn:
    id: action.coursesMenu
- tapOn:
    id: action.howCounted
- extendedWaitUntil:
    visible:
      id: sheet.kuliahFacts
    timeout: 5000
- assertVisible: "Hari ini ada 4 kuliah. Hanya PL3002 yang masih ada jatah absen."
- assertVisible: "Target 80%"
- takeScreenshot: w11-2-facts
- back
# The card opens its course: its absences in words under the name; "Cek ke dosen" is advice, so it's in the sheet behind the header.
- tapOn:
    id: row.course.KU5014
- extendedWaitUntil:
    visible:
      id: screen.course
    timeout: 10000
- assertVisible:
    id: meter.courseAttendance
- assertVisible:
    id: mark.courseAdvice
- assertNotVisible: "Cek ke dosen"
# Pertemuan leads the tabs of a course at risk, every tab whole.
- assertVisible:
    id: tab.course.meetings
- takeScreenshot: w11-3-course
- back
# The targets, in ⋮.
- tapOn:
    id: action.coursesMenu
- tapOn:
    id: action.target
- extendedWaitUntil:
    visible: "Target umum"
    timeout: 5000
