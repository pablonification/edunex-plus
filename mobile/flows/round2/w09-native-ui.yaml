# W9 (PROGRESS.md): Android's own controls. Settings' switches are Material's MaterialSwitch (checked state from
# Android itself), and a choice (Tema) is picked from a native bottom sheet, its value shown on the row.
# Fails on round 1 (9395cea): Tema was three JS segments in the page, no sheet.
appId: io.github.pablonification.edunexplus.demo
---
- clearState: io.github.pablonification.edunexplus.demo
- openLink: "edunexplusdemo://demo?EDUNEX_DEMO=signed-in"
- extendedWaitUntil:
    visible:
      id: tab.home
    timeout: 180000
# Settings is behind Profil's "Akun" rows (no avatar in a top bar any more).
- tapOn:
    id: tab.profile
- extendedWaitUntil:
    visible:
      id: screen.profile
    timeout: 10000
- scrollUntilVisible:
    element:
      id: action.account
    direction: DOWN
    centerElement: true
- tapOn:
    id: action.account
- extendedWaitUntil:
    visible:
      id: screen.settings
    timeout: 20000
- scrollUntilVisible:
    element:
      id: segment.theme
    centerElement: true
- tapOn:
    id: segment.theme
- extendedWaitUntil:
    visible:
      id: segment.theme.dark
    timeout: 10000
- tapOn:
    id: segment.theme.dark
- extendedWaitUntil:
    visible: ".*Gelap.*"
    timeout: 10000
- tapOn:
    id: segment.theme
- extendedWaitUntil:
    visible:
      id: segment.theme.system
    timeout: 10000
- tapOn:
    id: segment.theme.system
# The demo's phone has notifications off for the app: Settings folds the alert switches away and shows the one shared
# notice with its button in their place (the switches come back once notifications are on).
- scrollUntilVisible:
    element:
      id: note.notificationsOff
    direction: UP
    centerElement: true
- assertVisible:
    id: action.notificationsOn
- assertNotVisible:
    id: switch.alert.newTask
