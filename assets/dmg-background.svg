<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432">
  <!-- The window of the macOS disk image. Finder draws the app (left) and the Applications
       folder (right) on top, centred at 170,190 and 470,190 (electron-builder.config.mjs, dmg),
       with their names under them. The window is 432 high with Finder's title bar, so the
       bottom 32 px never show: nothing goes there. After a change: node scripts/make-dmg-background.mjs -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; text-anchor: middle; }
    .hint { font-size: 13px; fill: #5b5b61; }
    .place { font-weight: 500; fill: #1d1d1f; }
  </style>
  <rect width="640" height="432" fill="#f5f5f7"/>
  <image href="icon.svg" x="20" y="16" width="34" height="34"/>
  <text x="320" y="84" font-size="22" font-weight="600" letter-spacing="-0.2" fill="#1d1d1f">Drag Edunex Plus into Applications</text>
  <path d="M270 190 H370 M357 177 L370 190 L357 203" fill="none" stroke="#2f6feb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="hint" x="320" y="326">Then open it from Applications.</text>
  <text class="hint" x="320" y="346">If macOS blocks it: <tspan class="place">System Settings → Privacy &amp; Security → Open Anyway</tspan></text>
</svg>
