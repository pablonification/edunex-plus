<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- The window of the macOS disk image. Finder draws three icons on top, with their names
       under them (electron-builder.config.mjs, dmg): the app and the Applications folder
       centred at 170,150 and 470,150, and Terminal at 118,350. The window is 480 high with
       Finder's title bar, so the bottom 32 px never show: nothing goes there. The Terminal line
       is the fastest way past macOS's first-launch block (README, Install): no timing a button
       in System Settings. After a change: node scripts/make-dmg-background.mjs -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    .step { font-size: 16px; font-weight: 600; fill: #1d1d1f; letter-spacing: -0.1px; }
    .num { fill: #2f6feb; }
    .hint { font-size: 12px; fill: #6e6e73; }
    .code { font-family: Menlo, monospace; font-size: 13px; fill: #1d1d1f; }
  </style>
  <rect width="640" height="480" fill="#f5f5f7"/>
  <image href="icon.svg" x="20" y="16" width="30" height="30"/>
  <text class="step" x="320" y="62" text-anchor="middle"><tspan class="num">1</tspan><tspan dx="10">Drag</tspan> Edunex Plus into Applications</text>
  <path d="M272 150 H368 M355 137 L368 150 L355 163" fill="none" stroke="#2f6feb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 256 H592" stroke="#e1e1e6" stroke-width="1"/>
  <text class="step" x="200" y="314"><tspan class="num">2</tspan><tspan x="222">Open Terminal, type this, press Return</tspan></text>
  <rect x="222.5" y="330.5" width="377" height="39" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text class="code" x="238" y="355">xattr -cr "/Applications/Edunex Plus.app"</text>
  <text class="step" x="200" y="406"><tspan class="num">3</tspan><tspan x="222">Open Edunex Plus from Applications</tspan></text>
  <text class="hint" x="222" y="428">Once per version: after an update, type it again.</text>
</svg>
