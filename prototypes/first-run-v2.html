<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edunex Plus · first run v2 prototype</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --serif: ui-serif, "New York", Georgia, serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-scene: cubic-bezier(0.32, 0.72, 0, 1);
    --ink: #f5f7ff;
    --ink-2: rgb(235 240 255 / 0.62);
    --ink-3: rgb(235 240 255 / 0.4);
    --accent: #2f6feb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: default; }
  #frame { position: relative; width: 100%; overflow: hidden; border-radius: var(--radius, 12px); background: #04050a; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; background: #04050a; overflow: hidden; }
  #ascii { position: absolute; inset: 0; }
  #ascii canvas { display: block; width: 100%; height: 100%; }

  /* The opening's dedication. */
  /* Two lines, like a film's credit: small spaced capitals for the names, italic lowercase for the little words. */
  #credit { position: absolute; left: 0; right: 0; top: 366px; text-align: center; pointer-events: none; font-family: var(--serif); color: rgb(240 244 255 / 0.86); }
  #credit span { display: block; opacity: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.2em; line-height: 1.9; }
  #credit em { font-size: 20px; font-weight: 400; letter-spacing: 0.01em; margin-right: 0.35em; color: rgb(240 244 255 / 0.62); }
  #credit.plain span { font-size: 24px; font-style: italic; font-weight: 400; letter-spacing: 0.005em; line-height: 1.4; }
  /* The little word turns over in place: both words share one slot, right-aligned against the name, so nothing moves. */
  #credit .turn { display: inline-grid; grid-template-columns: 100%; justify-items: unsafe end; vertical-align: baseline; }
  #credit .turn i { grid-area: 1 / 1; font-style: italic; }
  #credit .turn i + i { opacity: 0; }
  /* Or stacked, from over for, bracketing the name once. */
  #credit .stack { display: inline-flex; flex-direction: column; align-items: flex-end; vertical-align: middle; margin-right: 0.5em; font-size: 15px; line-height: 1.15; }
  #credit .stack i { font-style: italic; }

  /* The app's mark: one element, always in the light. */
  #mark { position: absolute; left: 588px; top: 196px; width: 104px; height: 104px; opacity: 0; filter: drop-shadow(0 10px 30px rgb(0 0 0 / 0.55)); transition: left 900ms var(--ease-scene), top 900ms var(--ease-scene), width 900ms var(--ease-scene), height 900ms var(--ease-scene); }
  #mark img { display: block; width: 100%; height: 100%; }

  .step { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
  .step.on { visibility: visible; pointer-events: auto; }
  .center { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { margin: 0; font-size: 50px; line-height: 1.08; font-weight: 700; letter-spacing: -0.022em; }
  h2 { margin: 0; font-size: 38px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; min-height: 43px; }
  .sub { margin: 16px 0 0; font-size: 17px; line-height: 1.5; color: var(--ink-2); max-width: 480px; text-wrap: balance; min-height: 26px; }
  .fine { margin-top: 16px; font-size: 12.5px; color: var(--ink-3); }
  .w { display: inline-block; }
  .hidden { opacity: 0; }

  /* The app's own button, at its most tactile: a lit top edge, a darker bottom one, a soft lift. */
  .btn { margin-top: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; min-width: 150px; padding: 0 24px; border: 0; border-radius: 999px; color: #fff; font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em;
    background: linear-gradient(180deg, #5891ff 0%, #2f6feb 50%, #2862de 100%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), inset 0 -1px 0 rgb(0 10 60 / 0.35), inset 0 0 0 1px rgb(255 255 255 / 0.08), 0 1px 2px rgb(0 0 0 / 0.55), 0 10px 28px -8px rgb(47 111 235 / 0.75);
    text-shadow: 0 1px 1px rgb(0 20 80 / 0.35); transition: transform 150ms var(--ease-out), filter 150ms; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(0.97); }
  .btn[disabled] { filter: saturate(0.85) brightness(0.92); }
  kbd { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 6px; font: 600 12px var(--font); color: #fff;
    background: rgb(255 255 255 / 0.16); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -1px 0 rgb(0 0 0 / 0.2); }
  .spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.3); border-top-color: #fff; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Connect: Edunex and SIX either side of the app. */
  .src { position: absolute; top: 218px; width: 220px; margin-left: -110px; display: flex; flex-direction: column; align-items: center; }
  .src .icon { position: relative; width: 64px; height: 64px; }
  .src .tile { width: 64px; height: 64px; border-radius: 15px; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12), 0 10px 24px -8px rgb(0 0 0 / 0.7); }
  .src .tile.white { background: #fff; }
  .src .tile img { display: block; }
  .src .ok { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(180deg, #3ddc84, #1fb866); box-shadow: 0 0 0 3px #04050a, inset 0 1px 0 rgb(255 255 255 / 0.35); transform: scale(0); transition: transform 450ms cubic-bezier(0.34, 1.5, 0.64, 1); }
  .src.done .ok { transform: scale(1); }
  .src .name { margin-top: 16px; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
  .src .state { margin-top: 3px; font-size: 13px; color: var(--ink-3); min-height: 18px; white-space: nowrap; }
  .src.done .state { color: var(--ink-2); }
  .link { position: absolute; top: 249px; height: 2px; width: 104px; border-radius: 1px; background-image: linear-gradient(90deg, rgb(255 255 255 / 0.22) 50%, transparent 50%); background-size: 8px 2px; }
  .link i { position: absolute; inset: 0; border-radius: 1px; transform: scaleX(0); transition: transform 700ms var(--ease-scene); }
  .link.l i { transform-origin: left; background: linear-gradient(90deg, rgb(79 141 255 / 0.3), #6aa0ff); }
  .link.r i { transform-origin: right; background: linear-gradient(270deg, rgb(79 141 255 / 0.3), #6aa0ff); }
  .link.on i { transform: scaleX(1); }

  /* Reading: Home, in a window the light sits behind, coming into focus as the read comes in. */
  #window { position: absolute; left: 300px; top: 56px; width: 680px; height: 425px; border-radius: 12px; overflow: hidden; opacity: 0; background: #0d0e12;
    box-shadow: 0 0 0 1px rgb(255 255 255 / 0.1), 0 40px 90px -30px rgb(0 0 0 / 0.9); }
  #window img { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; transform: scale(0.53125); filter: blur(18px) brightness(0.6) saturate(0.4); transition: filter 700ms var(--ease-out); }
  .count { margin-top: 12px; font-size: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); font-weight: 600; }
  .now { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); min-height: 18px; }
  .now .dot { width: 6px; height: 6px; border-radius: 50%; background: #6aa0ff; animation: pulse 1.2s ease-in-out infinite; }
  .now .dot.done { animation: none; background: #3ddc84; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  #home { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  #dots { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 7px; opacity: 0; }
  #dots i { width: 6px; height: 6px; border-radius: 3px; background: rgb(255 255 255 / 0.22); transition: width 500ms var(--ease-scene), background 500ms; }
  #dots i.on { width: 20px; background: rgb(255 255 255 / 0.85); }
  #chrome { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; z-index: 5; }
  #chrome button { height: 28px; padding: 0 12px; border-radius: 999px; border: 0; background: rgb(255 255 255 / 0.07); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); color: rgb(235 240 255 / 0.7); font-size: 12px; font-weight: 500; }
  #chrome.light button { background: rgb(0 0 0 / 0.05); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1); color: #444; }
  @media (prefers-color-scheme: dark) { #chrome.light button { background: rgb(255 255 255 / 0.07); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); color: rgb(235 240 255 / 0.7); } }
</style>
</head>

<script>
/*
 * Gradient ASCII: soft gradient glows drawn in ASCII characters that scramble under the cursor.
 * Adapted from React Bits' GradientASCII (https://reactbits.dev/backgrounds/gradient-ascii,
 * github.com/DavidHDev/react-bits), Copyright (c) 2026 David Haz, MIT + Commons Clause License
 * Condition v1.0: used as part of this application; the component itself may not be sold or
 * redistributed on its own.
 * Changes here: plain JS instead of a React component; a morph between two shapes (uShapeB, uMorph);
 * a movable center for the eclipse (uCenter); settings that can change while it runs.
 */
const createAscii = (() => {
  const MAX_COLORS = 8, MAX_CLICKS = 4, MAX_TRAIL = 24, CLICK_LIFE = 1.2, TRAIL_LIFE = 0.7, TRAIL_STEP = 0.015;
  const INTRO_SECONDS = 2.4, ATLAS_CELL_W = 60, ATLAS_CELL_H = 100, ATLAS_COLUMNS = 16, FONT_SCALE = 0.78;
  const SHAPES = { horizon: 0, pinch: 1, rise: 2, eclipse: 3, radiance: 4 };

  const VERTEX = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
  const COMMON = `
float hash12(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}`;
  const FIELD = `#version 300 es
precision highp float;
precision highp int;
uniform float uAspect;
uniform float uTime;
uniform int uShape;
uniform int uShapeB;
uniform float uMorph;
uniform vec2 uCenter;
uniform vec3 uRamp[8];
uniform int uCount;
uniform float uScale;
uniform float uSoftness;
uniform float uFlow;
uniform vec2 uSeed;
uniform vec4 uTrail[24];
uniform float uRadius;
uniform vec4 uClicks[4];
uniform float uIntro;
uniform float uFrame;
in vec2 vUv;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;
${COMMON}
vec2 hash22(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.103, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xx + q.yz) * q.zy) * 2.0 - 1.0;
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);

  const grow = { duration: 1100, delay: 120, easing: "cubic-bezier(0.65, 0, 0.15, 1)" };
  anim(win, [{ left: "300px", top: "56px", width: "680px", height: "425px", borderRadius: "12px" }, { left: "0px", top: "0px", width: `${W}px`, height: `${H}px`, borderRadius: "0px" }], grow);
  anim(shot, [{ transform: "scale(0.53125)" }, { transform: "scale(1)" }], grow);
  light?.tween({ ...at(640, 400, 900), fade: 0 }, 1100 * SLOW);
  await wait(1250);
  $("#home").style.opacity = 1;
  win.style.visibility = "hidden";
  $("#chrome").classList.add("light");
}

$("#go").onclick = go;
addEventListener("keydown", (e) => { if (e.key === "Enter") { if (step === "opening") skipOpening(); else if (step === "hello") go(); } });
addEventListener("pointerdown", () => { ctx(); skipOpening(); }, { once: true });
opening();
</script>
