<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway UI for wayfinder ticket #8 ("UI shell design: minimal, hideable, uncluttered"),
  child of map #1 (EduNex Desktop MVP Spec). Never merge this file into main.

  REV 3 — built to the user's reference (Trenning LMS shots): floating rounded app window, slim
  icon rail, collapsible white panel, underline tabs, hairline rows. Palette is the REAL EduNex
  brand, sampled from the live login page (prototype/auth-spike/spike-401-shots/final.png):
  in-app palette corrected to the LIVE app (user screenshot): blue #027FFF primary,
  green #26B608 accent (class codes/semester/success), amber #F7B500 (counts), #F4F4F4 content bg.
  Type: Hanken Grotesk. Icons: Phosphor (regular/bold/fill via jsDelivr).
  Astryx was tried (rev 2) and rejected by the user — do not resurrect it.

  Question: what should the Edunex Plus app shell be?
    - A "Course hub" — reference layout 1: rail + panel + content + stats column
    - B "Stream + ⌘K" — reference layout 2: top nav bar, chronological stream, palette
    - C "Curated rail" — reference layouts 3–5: icon rail + collapsible panel you curate
  Plus: how users hide features they never use; what "calm, fast, obvious" means concretely.

  Three variants switchable via `?variant=A|B|C`, floating bottom bar, ← → keys cycle.
  Data uses real API shapes captured live in prototype/sync-spike (2026-09-01/02) — see
  FIXTURES; values beyond captured fragments are shape-faithful stand-ins.

  Run: double-click this file (or `open prototype/ui-shell-spike/index.html`). No build.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edunex Plus — shell prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root {
    --backdrop: #e3e4e4;
    --surface: #ffffff;
    --content-bg: #f4f4f4;
    --ink: #191b1d;
    --ink-2: #64696f;
    --ink-3: #9ba0a6;
    --line: #ececee;
    --blue: #027fff;          /* primary interactive — sampled from live app (My Courses active, tab underline) */
    --blue-deep: #0265c9;
    --blue-soft: #e8f2ff;
    --green: #26b608;         /* accent — class codes, semester, success (live app) */
    --green-deep: #1e9106;
    --green-ink: #1e9106;
    --green-soft: #e9f7e2;
    --amber: #e8971e;
    --amber-soft: #fdf3de;
    --red: #e5484d;
    --red-soft: #fdebec;
    --pill: #f3f4f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.5 "Hanken Grotesk", ui-sans-serif, sans-serif;
    background: var(--backdrop);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 28px;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, select { font: inherit; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
  i.ph, i.ph-bold, i.ph-fill { vertical-align: -2px; }
  ::placeholder { color: var(--ink-3); }

  /* ===== the floating app window (reference look) ===== */
  .window {
    display: flex; max-width: 1360px; margin: 0 auto;
    background: var(--surface); border-radius: 24px;
    box-shadow: 0 24px 60px rgba(25, 27, 29, 0.10), 0 2px 8px rgba(25,27,29,.05);
    overflow: hidden; min-height: calc(100vh - 56px);
  }

  /* ===== icon rail ===== */
  .rail {
    flex: none; width: 76px; padding: 18px 0 20px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .rail-logo {
    width: 40px; height: 40px; border-radius: 12px; background: var(--blue);
    color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px;
    margin-bottom: 18px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    color: #565b61; font-size: 20px; position: relative;
  }
  .rail-btn:hover { background: var(--pill); color: var(--ink); }
  .rail-btn.active { background: var(--blue-soft); color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); }
  .rail-btn .rb-badge {
    position: absolute; top: 4px; right: 4px; min-width: 15px; height: 15px; line-height: 15px;
    border-radius: 999px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; text-align: center; padding: 0 3px;
  }
  .rail-spacer { flex: 1; }
  .rail-add {
    width: 44px; height: 44px; border-radius: 14px; background: var(--blue); color: #fff;
    display: grid; place-items: center; font-size: 20px; margin-bottom: 6px;
  }
  .rail-ava {
    width: 38px; height: 38px; border-radius: 50%; background: var(--amber-soft); color: var(--amber);
    display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px var(--line);
  }

  /* ===== collapsible panel ===== */
  .panel {
    flex: none; width: 264px; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    padding: 26px 18px 20px 22px; display: flex; flex-direction: column; position: relative;
    transition: margin-left .18s ease, opacity .18s ease;
  }
  .window.panel-hidden .panel { margin-left: -264px; opacity: 0; pointer-events: none; }
  .panel-collapse {
    position: absolute; right: -15px; top: 26px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(25,27,29,.10);
    display: grid; place-items: center; font-size: 14px; color: var(--ink-2); z-index: 5;
  }
  .panel h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 18px; }
  .prow {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px;
    color: var(--ink-2); font-weight: 500; cursor: pointer; margin-bottom: 2px;
  }
  .prow i { font-size: 18px; color: #7c828a; }
  .prow:hover { background: var(--pill); color: var(--ink); }
  .phead-label { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 20px 12px 8px; }
  .prow.active { background: var(--blue-soft); color: var(--blue); font-weight: 700; box-shadow: inset 3px 0 0 var(--blue); }
  .prow.active i { color: var(--blue); }
  .prow .count { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--amber); background: var(--amber-soft); border-radius: 999px; padding: 1px 8px; }
  .prow .count.hot { background: var(--red-soft); color: var(--red); }
  .phead {
    display: flex; align-items: center; gap: 8px; margin: 20px 12px 8px;
    font-size: 14.5px; font-weight: 700;
  }
  .phead .ph { color: var(--ink-2); }
  .phead .n { font-size: 11px; background: var(--pill); border-radius: 999px; padding: 1px 7px; color: var(--ink-2); }
  .phead .add { margin-left: auto; color: var(--ink-2); font-size: 16px; }

  /* ===== content ===== */
  .content { flex: 1; min-width: 0; padding: 26px 30px 34px; overflow-y: auto; background: var(--content-bg); }
  .crumbs { display: flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 16px; }
  .crumbs .sep { color: var(--ink-3); }
  .crumbs .here { color: var(--ink); }
  .content h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }

  .pillrow { display: flex; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; background: var(--pill); color: var(--ink-2);
  }
  .pill.green { background: var(--green-soft); color: var(--green-ink); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.red { background: var(--red-soft); color: var(--red); }

  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin: 22px 0 0; }
  .tabs button { padding: 10px 2px 12px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 14.5px; }
  .tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }

  .list { margin-top: 20px; }
  .row {
    display: flex; align-items: center; gap: 16px; padding: 14px 6px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover .rowtitle { color: var(--blue-deep); }
  .row:last-child { border-bottom: none; }
  .rowtitle { font-weight: 700; font-size: 15px; transition: color .1s; }
  .rowsub { font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-top: 2px; }
  .thumb {
    flex: none; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
    font-size: 22px; font-weight: 800;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 12px;
    font-weight: 700; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn:hover { border-color: #d8dadc; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
  .btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.blue:hover { filter: brightness(1.06); }
  .btn.sm { padding: 6px 13px; font-size: 12.5px; border-radius: 10px; }

  /* ===== right stats column (reference layout 1) ===== */
  .with-side { display: grid; grid-template-columns: 1fr 330px; gap: 28px; align-items: start; }
  .side-card { border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .side-card + .side-card { margin-top: 14px; }
  .side-card h3 { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .bignum { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .cta {
    display: block; width: 100%; text-align: center; background: var(--blue); color: #fff;
    font-weight: 700; padding: 12px; border-radius: 12px; margin-top: 14px; font-size: 14.5px;
  }
  .cta:hover { background: var(--blue-deep); }

  /* ===== variant B top nav (reference layout 2) ===== */
  .b-topbar { display: flex; align-items: center; gap: 16px; padding: 20px 28px 0; }
  .b-word { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
  .b-word .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .b-search {
    flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; color: var(--ink-3); font-weight: 500;
  }
  .b-search .kbd { margin-left: auto; }
  .kbd {
    font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--pill);
    border-radius: 6px; padding: 2px 7px;
  }
  .b-nav { display: flex; gap: 24px; padding: 14px 28px 0; border-bottom: 1px solid var(--line); }
  .b-nav button { padding: 8px 2px 12px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .b-nav button.active { color: var(--blue); border-bottom-color: var(--blue); }
  .b-nav .nb { font-size: 11px; background: var(--pill); border-radius: 999px; padding: 1px 7px; color: var(--ink-2); font-weight: 700; }
  .banner-green {
    display: flex; align-items: center; gap: 12px; background: var(--blue-soft);
    border-radius: 14px; padding: 14px 18px; margin-top: 20px; font-weight: 500;
  }
  .banner-green .tag { background: var(--blue); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 8px; }
  .banner-green .go { margin-left: auto; font-weight: 700; color: var(--ink); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .greet { margin-top: 24px; }
  .greet h1 { font-size: 28px; }
  .greet .sub { color: var(--ink-2); font-weight: 500; margin-top: 4px; }
  .stat-cards { display: flex; gap: 12px; }
  .stat-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .stat-card .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; }
  .stat-card .n { font-size: 18px; font-weight: 800; }
  .stat-card .l { font-size: 12px; color: var(--ink-2); font-weight: 500; }

  /* palette overlay */
  .overlay-bg { position: fixed; inset: 0; background: rgba(25,27,29,.35); z-index: 60; border-radius: 0; }
  .palette {
    position: fixed; top: 14vh; left: 50%; transform: translateX(-50%);
    width: min(580px, 92vw); background: var(--surface); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.28); z-index: 61; overflow: hidden;
  }
  .palette input { width: 100%; padding: 16px 20px; font-size: 15.5px; border: none; outline: none; border-bottom: 1px solid var(--line); font-weight: 500; }
  .pal-row { display: flex; gap: 12px; align-items: center; padding: 11px 20px; cursor: pointer; font-weight: 500; }
  .pal-row:hover { background: var(--pill); }
  .pal-row i { color: var(--ink-3); }
  .pal-head { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 12px 20px 4px; }

  /* features dialog */
  .dlg {
    position: fixed; top: 18vh; left: 50%; transform: translateX(-50%);
    width: min(420px, 92vw); background: var(--surface); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.28); z-index: 61; padding: 22px;
  }
  .dlg h3 { font-size: 17px; font-weight: 800; }
  .feat-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .feat-row:last-of-type { border-bottom: none; }
  .feat-row .t { font-weight: 700; font-size: 14px; }
  .feat-row .d { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .tog { width: 38px; height: 22px; border-radius: 999px; background: #dcdedd; position: relative; flex: none; transition: background .15s; }
  .tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .tog.on { background: var(--green); }
  .tog.on::after { left: 18px; }

  /* ctx menu (variant C) */
  .ctxmenu {
    position: fixed; background: var(--surface); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(25,27,29,.18); padding: 5px; z-index: 70; min-width: 190px;
  }
  .ctxmenu button { display: flex; gap: 9px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .ctxmenu button:hover { background: var(--pill); }
  .ctxmenu i { color: var(--ink-3); }

  /* switcher */
  .switcher {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px;
    background: #1c1f1d; color: #fff; border-radius: 999px; padding: 5px 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.4); z-index: 100;
  }
  .switcher button { color: #cfd4d0; font-size: 14px; width: 30px; height: 30px; border-radius: 50%; }
  .switcher button:hover { background: #2c312e; color: #fff; }
  .switcher .label { font-size: 12.5px; font-weight: 500; padding: 0 10px; min-width: 210px; text-align: center; color: #cfd4d0; }
  .switcher .label b { color: #fff; font-weight: 700; }
  .proto-note { font-size: 12.5px; color: var(--ink-3); max-width: 660px; margin-top: 34px; }
  .proto-note b { color: var(--ink-2); }
</style>
</head>
<body>
<div id="app"></div>
<div class="switcher" id="switcher">
  <button id="prev">←</button>
  <div class="label" id="vlabel"></div>
  <button id="next">→</button>
</div>

<script>
"use strict";
/* =====================================================================
   FIXTURES — real API shapes captured live 2026-09-01/02 (sync-spike).
   Field names, nesting and endpoints exactly as observed. Captured-real
   values marked ✔; other values are shape-faithful stand-ins.
   ===================================================================== */
const NOW = new Date("2026-09-02T08:56:00+07:00"); // pinned demo clock

const PERIODS = [
  { id: "118", label: "Semester 2026-1" },

// GET /course/presences/list → array[6] (live fields). VALUES below are the user's real

// GET /course/agenda → [{type, course_name, name, start_at, end_at}] (live fields)
const AGENDA = [
  { type: "class", course_name: "Climate Change", name: "Kuliah — Climate Modeling Basics", start_at: "2026-09-02T09:30:00+07:00", end_at: "2026-09-02T11:00:00+07:00" },

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDay = iso => new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fmtClock = iso => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
function dueLabel(iso) {
  const d = new Date(iso) - NOW;
  if (d < 0) return "overdue";
  if (d < DAY) return `due in ${Math.ceil(d / HOUR)} h`;
  if (d < 7 * DAY) return `due in ${Math.ceil(d / DAY)} d`;
  return "due " + fmtDay(iso);
}
function countdown(iso) {
  const d = new Date(iso) - NOW;
  if (d <= 0) return "open now";
  const m = Math.round(d / 60000);
  return m < 60 ? `${m} min` : `${Math.round(m / 60)} h ${m % 60} min`;
}
const dueSoon = iso => new Date(iso) - NOW < 7 * DAY;
const courseById = id => COURSES.data.find(c => c.id === String(id));
const duePill = iso => dueSoon(iso)
  ? `<span class="pill red">${dueLabel(iso)}</span>`

      ${FEATURES.map(f => `
        <div class="feat-row">
          <div style="flex:1"><div class="t">${f.label}</div><div class="d">${f.desc}</div></div>
          <div class="tog ${f.on ? "on" : ""}" onclick="toggleFeature('${f.key}');state.cPage='settings'"></div>
        </div>`).join("")}
    </div>
    <div class="phead" style="margin-left:0"><i class="ph ph-eye-slash"></i> Hidden pages</div>
    <div class="side-card" style="max-width:560px">
      ${state.cHidden.length ? state.cHidden.map(k => `
        <div class="feat-row">
          <div style="flex:1" class="t">${C_PAGES.find(p => p.key === k)?.label ?? k}</div>
          <button class="btn sm" onclick="state.cHidden=state.cHidden.filter(x=>x!=='${k}');render()"><i class="ph ph-plus"></i> Add back</button>
        </div>`).join("") : `<div class="rowsub">Nothing hidden.</div>`}
    </div>`;
  }

  const unread = NOTIFICATIONS.data.unread_count;
  return `
  <div class="window">
    <div class="rail">
      <div class="rail-logo">e+</div>
      <button class="rail-btn ${!state.cHidden.includes("todo") ? "" : ""}" title="Notifications" onclick="state.notifOpen=!state.notifOpen;render()"><i class="ph ph-bell"></i>${unread ? `<span class="rb-badge">${unread}</span>` : ""}</button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" title="Visible features" onclick="state.featuresOpen=!state.featuresOpen;render()"><i class="ph ph-sliders-horizontal"></i></button>
      <button class="rail-btn ${page === "settings" ? "active" : ""}" title="Settings" onclick="state.cPage='settings';state.view={name:'home'};render()"><i class="ph ph-gear-six"></i></button>
      <div class="rail-ava">RF</div>
    </div>
    <div class="panel">
      <button class="panel-collapse" title="Show panel" onclick="this.closest('.window').classList.toggle('panel-hidden')"><i class="ph ph-caret-left"></i></button>
      <h2>Edunex Plus</h2>
      <div class="phead-label">Menu</div>
      ${pages.map(p => `
        <div class="prow ${page === p.key ? "active" : ""}" oncontextmenu="cCtx(event,'${p.key}');return false" onclick="state.cPage='${p.key}';state.view={name:'home'};render()">
          <i class="ph ${p.ic}"></i> ${p.label}
          ${p.key === "todo" && soon.length ? `<span class="count hot">${soon.length}</span>` : ""}
        </div>`).join("")}
      ${state.cHidden.length ? `
        <div class="phead"><i class="ph ph-plus-circle"></i> Hidden <span class="n">${state.cHidden.length}</span></div>
        <div class="prow" onclick="state.cPage='settings';render()"><i class="ph ph-eye-slash"></i> Manage hidden…</div>` : ""}
      <div class="rail-spacer"></div>
    </div>
    <div class="content">
      <button class="btn sm" style="margin-bottom:14px" onclick="document.querySelector('.panel').closest('.window').classList.toggle('panel-hidden')" title="Collapse the panel"><i class="ph ph-caret-double-left"></i> Collapse</button>
      ${main}
      <p class="proto-note"><b>C — Curated rail.</b> The reference's icon rail + panel, but you own it: right-click any panel row → Hide; hidden pages vanish from the app and collect under “Hidden”. Home is a To-Do-centric two-column page. Try hiding Presence or Materials and watch everything follow.</p>
    </div>
  </div>
  ${state.cCtx ? `<div class="ctxmenu" style="top:${state.cCtx.y}px;left:${state.cCtx.x}px">
    <button onclick="cHide('${state.cCtx.key}')"><i class="ph ph-eye-slash"></i> Hide “${C_PAGES.find(p => p.key === state.cCtx.key)?.label}”</button>
    <button onclick="state.cCtx=null;render()"><i class="ph ph-x"></i> Cancel</button>
  </div>` : ""}
  ${featuresDialog("In C, panel rows and pages hide together: right-click a row, or manage everything in Settings.")}
  ${palette()}${notifPopover()}`;
}
function cCtx(ev, key) { state.cCtx = { x: ev.clientX + 6, y: ev.clientY + 6, key }; render(); }
function cHide(key) {
  state.cHidden.push(key);
  if (state.cPage === key) state.cPage = "todo";
  state.cCtx = null;
  render();
}

/* ===== switcher + boot ===== */
const VARIANTS = {
  A: { name: "Course hub", render: variantA },
  B: { name: "Stream + ⌘K", render: variantB },
  C: { name: "Curated rail", render: variantC },
};
const ORDER = ["A", "B", "C"];
function setVariant(v) {
  state.variant = v;
  Object.assign(state, { view: { name: "home" }, featuresOpen: false, paletteOpen: false, notifOpen: false, cPage: "todo", cCtx: null });
  history.replaceState(null, "", `?variant=${v}`);
  render();
}
function cycle(d) {
  setVariant(ORDER[(ORDER.indexOf(state.variant) + d + ORDER.length) % ORDER.length]);
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "Escape") { state.paletteOpen = false; state.featuresOpen = false; state.notifOpen = false; state.cCtx = null; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); state.paletteOpen = true; render(); }
});
if (!VARIANTS[state.variant]) state.variant = "A";
function render() {
  document.getElementById("vlabel").innerHTML = `<b>${state.variant}</b> — ${VARIANTS[state.variant].name}`;
  document.getElementById("app").innerHTML = VARIANTS[state.variant].render();
}
render();
</script>
</body>
</html>
