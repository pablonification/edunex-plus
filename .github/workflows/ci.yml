# The checks every pull request and every push to main goes through. They run
# side by side, and each writes its result in plain words on the run's summary
# page. lint, typecheck, test, build and mobile must pass; knip only advises.
# The phone app's builds and its flows on an emulator are their own workflow (mobile.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Which parts of the repository a pull request touches, so the slower or
  # narrower checks below only run when they have something to look at.
  # A skipped check still counts as passed for merging.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      deps: ${{ steps.areas.outputs.deps }}
      mobile: ${{ steps.areas.outputs.mobile }}
      workflows: ${{ steps.areas.outputs.workflows }}
    steps:
      - name: See which areas the change touches
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          everything=false
          files=""
          if [ "$EVENT" != pull_request ]; then
            everything=true
          elif ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
            echo "::warning::Couldn't list the changed files, so every check runs."
            everything=true
          fi
          area() {
            if [ "$everything" = true ] || grep -qE "$2" <<< "$files"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            area deps '^(relay/)?package(-lock)?\.json$'
            # The phone app, what it shares with the desktop (src/), the tests its type check reads, and the root's packages those tests take their types from.
            area mobile '^((mobile|src|test/mobile)/|package(-lock)?\.json$)'
            area workflows '^\.github/'
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Lint and check formatting (Biome)
        id: check
        run: npx biome ci --colors=off . 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: node scripts/ci/summary.mjs lint "$OUTCOME" "$RUNNER_TEMP/check.log"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Check types (window, desktop and engine, tests)
        id: check
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: node scripts/ci/summary.mjs typecheck "$OUTCOME" "$RUNNER_TEMP/check.log"

  # The tests, a third of the files on each of three runners at once: about two minutes instead of six.
  # The test job below puts their results together.
  test-part:
    name: test (part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      # test/mobile reads the phone app's code, whose tsconfig extends Expo's: its packages too.
      - name: Install the phone app's packages
        run: npm ci --prefix mobile --no-audit --no-fund --ignore-scripts
      - name: Run a third of the tests
        # Failures become notes on their lines; the test job's summary replaces Vitest's own table.
        env:
          PART: ${{ matrix.part }}
        run: >-
          GITHUB_STEP_SUMMARY=''
          npx vitest run --shard="$PART/3" --reporter=default --reporter=github-actions
          --reporter=json --outputFile.json="$RUNNER_TEMP/vitest/part-$PART.json"
      - name: Keep the results for the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-part-${{ matrix.part }}
          path: ${{ runner.temp }}/vitest/part-${{ matrix.part }}.json
          if-no-files-found: ignore
          retention-days: 1

  test:
    name: test
    needs: test-part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the three parts' results
        # A part that crashed left none: the summary says so instead of this step failing.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-part-*
          path: ${{ runner.temp }}/vitest
          merge-multiple: true
      # The runner's own Node: the summary needs no packages.
      - name: Summarize
        env:
          OUTCOME: ${{ needs.test-part.result }}
        run: |
          node scripts/ci/summary.mjs test "$OUTCOME" "$RUNNER_TEMP"/vitest/part-{1,2,3}.json
          [ "$OUTCOME" = success ]

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Build the desktop side
        run: node scripts/build-desktop.mjs
      - name: Build the window
        run: npx vite build
      - name: Check the window's size
        id: size
        run: node scripts/check-bundle-size.mjs
      - name: Summarize a failed build
        if: ${{ failure() && steps.size.outcome == 'skipped' }}
        run: printf '### Build\n\n**The app did not build.** The log of this job says why.\n' >> "$GITHUB_STEP_SUMMARY"

  # The phone app's type check (mobile/tsconfig.json, with its own packages), which the typecheck job above
  # doesn't cover. Biome already checks mobile/, and test/mobile runs in the test jobs.
  mobile:
    name: mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # Both: the tests the phone's type check reads (test/mobile) take vitest from the root's packages. No install
      # scripts: the root's fetch and sign Electron, and the phone's patches (mobile/patches) change native code, not types.
      - name: Install the packages
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - name: Check the phone app's types
        id: check
        working-directory: mobile
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: node scripts/ci/summary.mjs mobile "$OUTCOME" "$RUNNER_TEMP/check.log"

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Look for unused files, exports and dependencies
        id: check
        # Advisory while the revamp branches still move code around. Delete this
        # line to make knip block merging.
        continue-on-error: true
        run: npx knip --reporter markdown > "$RUNNER_TEMP/knip.md"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          node scripts/ci/summary.mjs knip "$OUTCOME" "$RUNNER_TEMP/knip.md"
          if [ "$OUTCOME" != success ]; then echo "::warning title=knip::knip found unused code (advisory for now). The run summary lists it."; fi

  # Workflow files: mistakes (actionlint) and security slips (zizmor).
  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflow files (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # Each problem as a note on its line: actionlint reports JSON, jq turns it into notes.
          status=0
          "$RUNNER_TEMP/actionlint" -format '{{json .}}' > "$RUNNER_TEMP/actionlint.json" || status=$?
          jq -r '.[]? | "::error file=\(.filepath),line=\(.line),col=\(.column)::\(.message)"' "$RUNNER_TEMP/actionlint.json"
          exit "$status"
      - name: Check the workflows for security slips (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            line="All clear: the workflow files have no mistakes (actionlint) and no known security slips (zizmor)."
          else
            line="**The workflow files have problems.** Each is marked on its line in the pull request's Files tab."
          fi
          printf '### Workflow files\n\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

  # New or updated packages: no known high-severity hole, no licence that
  # would force the app's licence to change.
  dependency-review:
    name: dependency-review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review new and updated packages
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Electron and the build tools ship inside the app, so their holes count too.
          fail-on-scopes: runtime, development
          # Permissive licences only (this also keeps GPL and AGPL out). A new
          # package with an unknown licence is reported but doesn't fail.
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, MPL-2.0,
            BlueOak-1.0.0, Python-2.0, CC-BY-4.0, CC0-1.0, Unlicense, WTFPL, Zlib
          # wrangler, the tool that puts the report relay online (relay/), brings sharp to run the
          # relay on the maintainer's computer, and sharp's prebuilt image library is LGPL. It runs
          # there only: none of it is in the app, or in the relay that's put online.
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64, pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm, pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64, pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x, pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64, pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-wasm32, pkg:npm/@img/sharp-win32-arm64, pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-x64,
            pkg:npm/big-integer, pkg:npm/jsonify, pkg:npm/unicode-match-property-value-ecmascript, pkg:npm/xmlbuilder
          # Those last four come with the phone app's build tools (Babel, Expo's config plugins and command line): public domain or
          # Unicode's data licence, both permissive, just not in the list above.
          # Expo's command line (mobile/) keeps its own zod 3 for its development server's DevTools plugin schema.
          # The advisory (oversized collections can exhaust memory) is fixed only in zod 4, which that code doesn't
          # use; it runs on the developer's computer, never in the APK, and never sees a Student's data.
          allow-ghsas: GHSA-mrhx-c7xc-m3w5
