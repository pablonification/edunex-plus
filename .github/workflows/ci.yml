# The checks every pull request and every push to main goes through. They run
# side by side, and each writes its result in plain words on the run's summary
# page. lint, typecheck, test and build must pass; knip and screens only advise.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Which parts of the repository a pull request touches, so the slower or
  # narrower checks below only run when they have something to look at.
  # A skipped check still counts as passed for merging.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      screens: ${{ steps.areas.outputs.screens }}
      deps: ${{ steps.areas.outputs.deps }}
      workflows: ${{ steps.areas.outputs.workflows }}
    steps:
      - name: See which areas the change touches
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          everything=false
          files=""
          if [ "$EVENT" != pull_request ]; then
            everything=true
          elif ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
            echo "::warning::Couldn't list the changed files, so every check runs."
            everything=true
          fi
          area() {
            if [ "$everything" = true ] || grep -qE "$2" <<< "$files"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            area screens '^(src/app/|src/core/|scripts/demo/|test/pretend/|package-lock\.json$|\.github/workflows/ci\.yml$)'
            area deps '^package(-lock)?\.json$'
            area workflows '^\.github/'
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Lint and check formatting (Biome)
        id: check
        run: npx biome ci --colors=off . 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: node scripts/ci/summary.mjs lint "$OUTCOME" "$RUNNER_TEMP/check.log"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Check types (window, desktop and engine, tests)
        id: check
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: node scripts/ci/summary.mjs typecheck "$OUTCOME" "$RUNNER_TEMP/check.log"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Run the tests
        id: check
        # Failures become notes on their lines; the summary below replaces Vitest's own table.
        run: >-
          GITHUB_STEP_SUMMARY=''
          npx vitest run --reporter=default --reporter=github-actions
          --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: node scripts/ci/summary.mjs test "$OUTCOME" "$RUNNER_TEMP/vitest.json"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Build the desktop side
        run: node scripts/build-desktop.mjs
      - name: Build the window
        run: npx vite build
      - name: Check the window's size
        id: size
        run: node scripts/check-bundle-size.mjs
      - name: Summarize a failed build
        if: ${{ failure() && steps.size.outcome == 'skipped' }}
        run: printf '### Build\n\n**The app did not build.** The log of this job says why.\n' >> "$GITHUB_STEP_SUMMARY"

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Look for unused files, exports and dependencies
        id: check
        # Advisory while the revamp branches still move code around. Delete this
        # line to make knip block merging.
        continue-on-error: true
        run: npx knip --reporter markdown > "$RUNNER_TEMP/knip.md"
      - name: Summarize
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          node scripts/ci/summary.mjs knip "$OUTCOME" "$RUNNER_TEMP/knip.md"
          if [ "$OUTCOME" != success ]; then echo "::warning title=knip::knip found unused code (advisory for now). The run summary lists it."; fi

  # Workflow files: mistakes (actionlint) and security slips (zizmor).
  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflow files (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # Each problem as a note on its line: actionlint reports JSON, jq turns it into notes.
          status=0
          "$RUNNER_TEMP/actionlint" -format '{{json .}}' > "$RUNNER_TEMP/actionlint.json" || status=$?
          jq -r '.[]? | "::error file=\(.filepath),line=\(.line),col=\(.column)::\(.message)"' "$RUNNER_TEMP/actionlint.json"
          exit "$status"
      - name: Check the workflows for security slips (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            line="All clear: the workflow files have no mistakes (actionlint) and no known security slips (zizmor)."
          else
            line="**The workflow files have problems.** Each is marked on its line in the pull request's Files tab."
          fi
          printf '### Workflow files\n\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

  # New or updated packages: no known high-severity hole, no licence that
  # would force the app's licence to change.
  dependency-review:
    name: dependency-review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review new and updated packages
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Electron and the build tools ship inside the app, so their holes count too.
          fail-on-scopes: runtime, development
          # Permissive licences only (this also keeps GPL and AGPL out). A new
          # package with an unknown licence is reported but doesn't fail.
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, MPL-2.0,
            BlueOak-1.0.0, Python-2.0, CC-BY-4.0, CC0-1.0, Unlicense, WTFPL, Zlib

  # The screens a pull request changes, before and after, on the demo's made-up
  # data, so the maintainer sees what changed without reading code: the tour of
  # every screen runs on the pull request and on its base side by side, and the
  # pictures that differ are kept, cropped to the change.
  screens:
    name: screens
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.screens == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Advisory: Electron on a virtual screen can be flaky. A failure shows but doesn't block merging.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the base, for the pictures before
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Set up the base's packages
        working-directory: .base
        run: npm ci --no-audit --no-fund
      - name: Let Electron's sandbox start (Ubuntu 24.04 limits it by default)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Get a virtual screen
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Download Electron
        run: |
          node -e 'console.log(require("electron"))'
          (cd .base && node -e 'console.log(require("electron"))')
      - name: Build the demo app, as the pull request leaves it and as its base has it
        run: |
          npm run demo:build
          (cd .base && npm run demo:build)
      - name: Take the pictures, before and after
        # About 8 minutes each, side by side: the first-run scenario waits in real time for the first sync.
        timeout-minutes: 25
        run: |
          # Each tour gets its own virtual screen: two "--auto-servernum" starting together can pick the same one and hang.
          # And each stops after 20 minutes, so one stuck tour can't take the other's pictures with it.
          tour() { timeout 1200 xvfb-run --server-num="$1" --server-args="-screen 0 1600x1000x24" node scripts/demo/capture.mjs "$2"; }
          tour 91 "$RUNNER_TEMP/screens" > "$RUNNER_TEMP/capture.log" 2>&1 &
          after=$!
          (cd .base && tour 92 "$RUNNER_TEMP/screens-before" > "$RUNNER_TEMP/capture-before.log" 2>&1) &
          before=$!
          status=0
          wait "$after" || status=$?
          wait "$before" || echo "The base's pictures couldn't all be taken (see capture-before.log in the artifact)."
          cat "$RUNNER_TEMP/capture.log"
          exit "$status"
      - name: Find the screens that changed
        if: ${{ !cancelled() }}
        run: |
          # Only when the base's tour finished ("saved N pictures"): half a tour would make every other screen look new.
          if grep -q "^saved " "$RUNNER_TEMP/capture-before.log" 2>/dev/null && [ -d "$RUNNER_TEMP/screens" ]; then
            node scripts/ci/screens-compare.mjs "$RUNNER_TEMP/screens-before" "$RUNNER_TEMP/screens" "$RUNNER_TEMP/changed"
          fi
      - name: Upload the pictures
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-pr${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/capture.log
            ${{ runner.temp }}/capture-before.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Write the comment
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          node scripts/ci/screens-comment.mjs "$RUNNER_TEMP/screens" "$RUNNER_TEMP/capture.log" "$RUNNER_TEMP/changed" \
            "$ARTIFACT_URL" "$COMMIT" "$BASE" "$RUNNER_TEMP/changed/comment.md"
      - name: Hand the changed screens and the comment to screens-post
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-changed-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/changed
          if-no-files-found: ignore
          retention-days: 1

  # Puts the changed screens' pictures where the comment can show them (the
  # pr-assets branch, which only holds pictures), then posts the comment. A job
  # of its own: it may write, so it runs none of the pull request's code, and
  # only for pull requests from this repository (a fork's run can't write).
  screens-post:
    name: screens-post
    needs: screens
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.screens.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write # add the pictures to the pr-assets branch
      pull-requests: write # post and update the pictures comment
    steps:
      - name: Get the changed screens and the comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screens-changed-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/changed
      - name: Put the pictures on the pr-assets branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          from="$RUNNER_TEMP/changed"
          folder="pr-$PR/${COMMIT:0:7}"
          comment="$RUNNER_TEMP/comment.md"
          sed "s#{{IMAGES}}#https://github.com/$GITHUB_REPOSITORY/blob/pr-assets/$folder#g" "$from/comment.md" > "$comment"
          if ! ls "$from"/*.png > /dev/null 2>&1; then exit 0; fi
          git init -q "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            if git -c http.extraheader="$auth" fetch -q --depth 1 "$remote" pr-assets; then
              git checkout -q -B pr-assets FETCH_HEAD
            else
              git checkout -q --orphan pr-assets
            fi
            mkdir -p "$folder" && cp "$from"/*.png "$folder/"
            git add "$folder" && git commit -q -m "screens: #$PR at ${COMMIT:0:7}"
            if git -c http.extraheader="$auth" push -q "$remote" pr-assets; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Couldn't add the pictures to pr-assets." && exit 1
      - name: Post it on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- edunex-plus:screens -->"
          body="$marker
          $(cat "$RUNNER_TEMP/comment.md")"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
