# The Android app (mobile/): builds its APKs, runs its Maestro flows on an
# emulator, and takes the desktop demo's pictures to compare the two. Every
# native build of the phone app happens here, not on a laptop.
#
# Two sizes of run:
# - Quick (a pull request, or a push to main, that changes the app): the APKs,
#   the desktop pictures and the "app" flows on one emulator, about 30 minutes.
# - Full (every night, or by hand): the quick run plus every scenario's
#   same-data flows, one emulator each. Each takes 1.5 to 3 hours, which is
#   why pull requests don't wait for them.
#
# By hand: `gh workflow run mobile.yml --ref <branch>` (add `-f scenarios=false`
# for the quick run).
#
# Fetching the results: `gh run download <run id>` saves every APK, the flows'
# results and the desktop pictures, one folder per artifact.
name: Mobile

on:
  pull_request:
    paths:
      - mobile/**
      - src/**
      - test/pretend/**
      - test/fixtures/**
      - scripts/demo/**
      - scripts/ci/mobile-e2e.sh
      - .github/workflows/mobile.yml
      - .nvmrc
      # Notes and the hand-off report don't change the app.
      - "!mobile/**/*.md"
      - "!mobile/report/**"
  push:
    branches: [main]
    paths:
      - mobile/**
      - src/**
      - test/pretend/**
      - test/fixtures/**
      - scripts/demo/**
      - scripts/ci/mobile-e2e.sh
      - .github/workflows/mobile.yml
      - .nvmrc
      # Notes and the hand-off report don't change the app.
      - "!mobile/**/*.md"
      - "!mobile/report/**"
  schedule:
    # Every night at 02:00 WIB, the full run on main.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      apks:
        description: Which APKs to build (the e2e job always gets the demo release APK).
        type: choice
        options: [all, demo-release, qa, ios, none]
        default: all
      e2e:
        description: Run the Maestro flows on an emulator.
        type: boolean
        default: true
      scenarios:
        description: Also run every scenario's same-data flows (1.5 to 3 hours each), not only the "app" flows.
        type: boolean
        default: true
      flows:
        description: Which flows, as a glob from mobile/flows (empty is all of them; e.g. "smoke.yaml" or "tugas/**/*").
        type: string
        default: ""
      desktop-shots:
        description: Take the desktop demo's pictures, light and dark.
        type: boolean
        default: true

permissions:
  contents: read

# On a pull request a new push cancels the run before it: only the newest commit matters there.
# Elsewhere a run waits for the one going (only the newest waiting run goes next), so the nightly
# full run isn't cut short. Each kind of run queues on its own, so a push to main can't take a
# waiting nightly run's place.
concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # What this run does: on a pull request or a push, the quick run; every night, the full run; by hand, what
  # the inputs ask for.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apks: ${{ steps.plan.outputs.apks }}
      e2e: ${{ steps.plan.outputs.e2e }}
      desktop-shots: ${{ steps.plan.outputs.desktop-shots }}
      groups: ${{ steps.plan.outputs.groups }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - name: Decide which jobs run
        id: plan
        env:
          APKS: ${{ inputs.apks || 'all' }}
          E2E: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
          SHOTS: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop-shots }}
          SCENARIOS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenarios) }}
        run: |
          # demo: EXPO_PUBLIC_DEMO; abis: only what the APK is for, since each ABI is a whole native build.
          all='[
            {"name": "edunex-plus-demo-release", "demo": "1", "task": "assembleRelease", "out": "release/app-release.apk", "abis": "x86_64,arm64-v8a"},
            {"name": "edunex-plus-release", "demo": "", "task": "assembleRelease", "out": "release/app-release.apk", "abis": "arm64-v8a,armeabi-v7a,x86_64"},
            {"name": "edunex-plus-demo-dev-client", "demo": "1", "task": "assembleDebug", "out": "debug/app-debug.apk", "abis": "x86_64"},
            {"name": "edunex-plus-dev-client", "demo": "", "task": "assembleDebug", "out": "debug/app-debug.apk", "abis": "x86_64"}
          ]'
          case "$APKS" in
            all) apks=$(jq -c . <<< "$all") ;;
            # QA builds for a real account on a phone: reads only (EXPO_PUBLIC_R3_GUARD), arm64 only.
            qa) apks='[{"name": "edunex-plus-qa-release", "demo": "", "guard": "1", "task": "assembleRelease", "out": "release/app-release.apk", "abis": "arm64-v8a"},
              {"name": "edunex-plus-qa-dev-client", "demo": "", "guard": "1", "task": "assembleDebug", "out": "debug/app-debug.apk", "abis": "arm64-v8a"},
              {"name": "edunex-plus-demo-release", "demo": "1", "task": "assembleRelease", "out": "release/app-release.apk", "abis": "x86_64,arm64-v8a"}]'
              apks=$(jq -c . <<< "$apks") ;;
            # The iPhone build is its own job (ios): no APK.
            ios) apks='[]' ;;
            *) apks=$(jq -c 'map(select(.name == "edunex-plus-demo-release"))' <<< "$all") ;;
          esac
          if [ "$APKS" = none ] && [ "$E2E" != true ]; then apks='[]'; fi
          # The emulators: "app" always; each scenario's same-data flows only on a full run.
          groups='["app"]'
          if [ "$SCENARIOS" = true ]; then
            groups='["app", "signed-in", "edunex-only", "first-run", "check-in-open", "quiz", "after-class-counted",
              "after-class-absent", "after-class-missing", "sick", "odd", "course-table-changed", "course-table-lost",
              "course-table-blank", "timetable-unread", "edit"]'
          fi
          {
            echo "apks=$apks"
            echo "e2e=$E2E"
            echo "desktop-shots=$SHOTS"
            echo "groups=$(jq -c . <<< "$groups")"
            echo "scenarios=$SCENARIOS"
          } | tee -a "$GITHUB_OUTPUT"

  apk:
    name: apk (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.apks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apks) }}
    env:
      EXPO_PUBLIC_DEMO: ${{ matrix.demo }}
      EXPO_PUBLIC_R3_GUARD: ${{ matrix.guard }}
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle (with its cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install the phone app's packages
        # Metro resolves everything, ../src included, from mobile/node_modules: no root install.
        run: npm ci --no-audit --no-fund
      - name: Install the NDK React Native asks for
        # Gradle would download it itself, but a broken download there fails the build: here it's tried again.
        run: |
          ndk=$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          [ -n "$ndk" ] || { echo "::error::Couldn't read React Native's NDK version."; exit 1; }
          [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ] && { echo "NDK $ndk is already there."; exit 0; }
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null && exit 0
            echo "::warning::Downloading NDK $ndk failed (try $attempt of 3)."
            rm -rf "$ANDROID_HOME/ndk/$ndk"
          done
          exit 1
      - name: Make the demo's data
        run: npm run --if-present demo:fixtures
      - name: List the open-source licences
        run: npm run licences
      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Tune Gradle
        working-directory: mobile/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # The generated file has no newline at its end.
          {
            echo
            echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
          } >> gradle.properties
      - name: Build the APK
        working-directory: mobile/android
        env:
          TASK: ${{ matrix.task }}
          ABIS: ${{ matrix.abis }}
        run: ./gradlew "$TASK" -PreactNativeArchitectures="$ABIS" --no-daemon
      - name: Name the APK
        env:
          NAME: ${{ matrix.name }}
          OUT: ${{ matrix.out }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp "android/app/build/outputs/apk/$OUT" "$RUNNER_TEMP/apk/$NAME.apk"
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-apk
          path: ${{ runner.temp }}/apk/${{ matrix.name }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Summarize
        env:
          NAME: ${{ matrix.name }}
          TASK: ${{ matrix.task }}
          ABIS: ${{ matrix.abis }}
        run: |
          size=$(du -h "$RUNNER_TEMP/apk/$NAME.apk" | cut -f1)
          if [ "$TASK" = assembleRelease ]; then
            kind="Release APK, signed with the debug key for now: fine to install and test, not to publish."
          else
            kind="Dev client: loads the app's JavaScript from Metro (\`npm run start\` or \`start:demo\` in mobile/)."
          fi
          # shellcheck disable=SC2016 # the backticks are Markdown, written as they are
          printf '### %s.apk\n\n%s\n\n- For: %s\n- Size: %s\n- Artifact: `%s-apk`\n' "$NAME" "$kind" "$ABIS" "$size" "$NAME" >> "$GITHUB_STEP_SUMMARY"

  # The flows in mobile/flows on the demo release APK, on an Android emulator.
  # One emulator per group, side by side: "app" runs the top-level flows (the smoke test and the same-feel
  # judge's pictures, light and dark); each scenario runs its same-data flows, made from the desktop's
  # inventory (mobile/flows/expected) by mobile/scripts/flows-from-inventory.mjs.
  e2e:
    name: e2e (${{ matrix.group }})
    needs: [plan, apk]
    if: ${{ !cancelled() && needs.plan.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    # A scenario's same-data flows take about 100 minutes (a course's 200 items, each module opened afresh); the
    # after-class scenarios ran past 180 on v4 (2026-11-01, run 41311251121) and were cut before their results were kept.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      # The group's name for the steps' scripts, as a variable rather than written into them.
      GROUP: ${{ matrix.group }}
      MAESTRO_VERSION: 2.12.0
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the demo release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edunex-plus-demo-release-apk
          path: ${{ runner.temp }}/apk
      - name: Set up Java (for Maestro)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Set up Node (for the same-data flows)
        if: ${{ matrix.group != 'app' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Make the same-data flows
        if: ${{ matrix.group != 'app' }}
        run: node mobile/scripts/flows-from-inventory.mjs "$GROUP"
      # Sixteen jobs fetch the same system image at once, and now and then one gets a broken zip ("Error on ZipFile
      # unknown archive") and never starts its emulator: fetched here first, again on a failure.
      - name: Fetch the emulator's system image
        run: |
          for attempt in 1 2 3; do
            printf "y\ny\ny\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-34;google_apis;x86_64" > /dev/null && exit 0
            echo "Attempt $attempt failed, trying again"
            sleep 20
          done
          exit 1
      - name: Run the flows on an emulator
        id: flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # The app group: the flows asked for (all top-level ones by default); a scenario: its same-data flows.
          FLOWS: ${{ matrix.group == 'app' && (inputs.flows || '*.yaml') || format('data/{0}/*.yaml', matrix.group) }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone's size (1080x2400, 412 dp wide), not the emulator's small default.
          profile: pixel_6
          # More than the emulator's default two cores and 2 GB, of the runner's four and 16 GB: with less, its own
          # launcher and Play services stopped answering during the flows.
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: scripts/ci/mobile-e2e.sh "$RUNNER_TEMP/apk/edunex-plus-demo-release.apk" "$RUNNER_TEMP/e2e" "$FLOWS"
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.group }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.flows.outcome }}
        run: |
          junit="$RUNNER_TEMP/e2e/junit.xml"
          if [ -f "$junit" ]; then
            # Adds up one attribute of every <testsuite> (Maestro leaves out the ones that are zero).
            count() { grep -o "<testsuite [^>]*" "$junit" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p" | awk '{ n += $1 } END { print n + 0 }'; }
            tests=$(count tests)
            failures=$(( $(count failures) + $(count errors) ))
            line="$((tests - failures)) of $tests flows passed."
          else
            line="**The flows did not run** (no JUnit results). The job's log says why."
          fi
          [ "$OUTCOME" = success ] || line="**Some flows failed.** $line"
          # shellcheck disable=SC2016 # the backticks are Markdown, written as they are
          printf '### Flows: %s\n\n%s Screenshots and logs: artifact `e2e-results-%s`.\n' "$GROUP" "$line" "$GROUP" >> "$GITHUB_STEP_SUMMARY"

  # The same-data score over every scenario that ran (check A in mobile/PROGRESS.md), in the run's summary.
  # An unsigned iPhone build (read-only QA), by hand only: `gh workflow run mobile.yml -f apks=ios -f e2e=false
  # -f scenarios=false -f desktop-shots=false`. The .ipa is signed on the developer's Mac (AltServer or Sideloadly with
  # their Apple ID) to install over a cable: mobile/IOS.md.
  ios:
    name: ipa (edunex-plus-qa-ios)
    if: github.event_name == 'workflow_dispatch' && inputs.apks == 'ios'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_R3_GUARD: "1"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install the phone app's packages
        run: npm ci --no-audit --no-fund
      - name: List the open-source licences
        run: npm run licences
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Check the widget extension was made
        # expo-widgets (app.config.ts) adds the WidgetKit target, its App Group and the two widgets at prebuild.
        run: |
          ls ios/ExpoWidgetsTarget
          grep -q "ExpoWidgetsTarget" ios/*.xcodeproj/project.pbxproj || { echo "::error::No widget target in the Xcode project."; exit 1; }
          grep -l "group.io.github.pablonification.edunexplus" ios/*/*.entitlements | grep -qv ExpoWidgetsTarget || { echo "::error::No App Group on the app."; exit 1; }
          for widget in EdunexNow EdunexToday; do
            test -f "ios/ExpoWidgetsTarget/$widget.swift" || { echo "::error::No $widget widget."; exit 1; }
          done
      - name: Install the root packages (for the widgets' checks)
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the widgets' code on the demo's data, and sketch it
        # The functions the widget extension runs, in every family, light and dark (test/mobile/widget-ios-preview.test.ts):
        # each must draw. The sketch is flexbox, not iOS's drawing: a look before an iPhone can.
        working-directory: .
        env:
          WIDGET_IOS_PREVIEW: ${{ runner.temp }}/ios-widget-sketches
        run: npx vitest run test/mobile/widget-ios-doc.test.ts test/mobile/widget-ios-preview.test.ts
      - name: Upload the widgets' sketch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-widget-sketches
          path: ${{ runner.temp }}/ios-widget-sketches
          if-no-files-found: error
          retention-days: 7
      - name: Build the app, unsigned
        run: |
          xcodebuild -workspace ios/*.xcworkspace -scheme "$(basename ios/*.xcworkspace .xcworkspace)" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check the widgets are inside the app
        # The widget extension rides in the app's PlugIns folder, with the layouts it draws before the app's first
        # run (expo-widgets' layout registry). The App Group is said in a later step; whether the signer grants it is the phone's to prove.
        run: |
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          appex="$app/PlugIns/ExpoWidgetsTarget.appex"
          test -d "$appex" || { echo "::error::The app has no widget extension."; ls "$app/PlugIns" || true; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$app/Info.plist"
          registry=$(find "$appex" "$app" -name ExpoWidgetsLayoutRegistry.json | head -n 1)
          echo "Layout registry: ${registry:-none}"
          if [ -n "$registry" ]; then
            for widget in EdunexNow EdunexToday; do
              grep -q "$widget" "$registry" || echo "::warning::$widget has no first layout: the gallery may show it blank until the app is opened."
            done
          fi
          {
            echo "### iPhone widgets"
            echo
            echo "- Extension: \`$(basename "$appex")\` ($(du -sh "$appex" | cut -f1))"
            if [ -n "$registry" ]; then echo "- First layouts: found"; else echo "- First layouts: missing"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Say the App Group inside the app
        # Unsigned code carries no entitlements, and Sideloadly or AltStore sign with what the app carries: without
        # this the widgets got no App Group on a sideloaded iPhone and stayed empty (scripts/ios-app-group.sh).
        run: scripts/ios-app-group.sh "$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
      - name: Pack the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/Build/Products/Release-iphoneos/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry edunex-plus-qa-ios.ipa Payload)
      - name: Upload the .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edunex-plus-qa-ios-ipa
          path: ${{ runner.temp }}/ipa/edunex-plus-qa-ios.ipa
          if-no-files-found: error
          retention-days: 7

  score:
    name: score
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.outputs.e2e == 'true' && needs.plan.outputs.scenarios == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download every group's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          path: ${{ runner.temp }}/results
      - name: Count what the phone shows
        run: node mobile/scripts/flows-from-inventory-report.mjs "$RUNNER_TEMP/results" --missing | tee "$RUNNER_TEMP/score.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the score
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: same-data-score
          path: ${{ runner.temp }}/score.md

  # The desktop demo's pictures in light and dark, to hold the phone's screens against.
  desktop-shots:
    name: desktop-shots
    needs: plan
    if: needs.plan.outputs.desktop-shots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The demo's day is in WIB, as the phone's pictures are (scripts/ci/mobile-e2e.sh): a runner in UTC
    # would put every class seven hours early.
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
      - name: Build the demo
        run: npm run demo:build
      - name: Let Electron run on a virtual screen
        run: |
          # Ubuntu 24.04 keeps Chromium's sandbox from starting; this lifts that for the runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Take the pictures (light)
        run: xvfb-run --auto-servernum node scripts/demo/capture.mjs "$RUNNER_TEMP/desktop-shots-light" --theme light
      - name: Take the pictures (dark)
        run: xvfb-run --auto-servernum node scripts/demo/capture.mjs "$RUNNER_TEMP/desktop-shots-dark" --theme dark
      - name: Upload the light pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-shots-light
          path: ${{ runner.temp }}/desktop-shots-light
          if-no-files-found: error
          retention-days: 14
      - name: Upload the dark pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-shots-dark
          path: ${{ runner.temp }}/desktop-shots-dark
          if-no-files-found: error
          retention-days: 14
      - name: Summarize
        run: |
          light=$(find "$RUNNER_TEMP/desktop-shots-light" -name '*.png' | wc -l)
          dark=$(find "$RUNNER_TEMP/desktop-shots-dark" -name '*.png' | wc -l)
          # shellcheck disable=SC2016 # the backticks are Markdown, written as they are
          printf '### Desktop pictures\n\n%s light (`desktop-shots-light`), %s dark (`desktop-shots-dark`), from the demo'"'"'s made-up data.\n' "$light" "$dark" >> "$GITHUB_STEP_SUMMARY"
