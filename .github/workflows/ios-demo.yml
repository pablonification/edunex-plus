# An unsigned iPhone build of the demo (made-up data), to sideload with a free Apple ID (Sideloadly signs
# it on the way in). Only the demo: signing in needs mobile/modules/web-cookies, which is Android-only, so
# the real app would stop at the welcome screen on an iPhone.
#
# Runs from a push to ios-demo-build; the .ipa is the run's `edunex-plus-demo-ipa` artifact.
name: iOS demo

on:
  push:
    branches: [ios-demo-build]

permissions:
  contents: read

concurrency:
  group: ios-demo-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ipa:
    name: ipa (edunex-plus-demo)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_DEMO: "1"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Say which Xcode builds it
        run: xcodebuild -version
      - name: Install the phone app's packages
        run: npm ci --no-audit --no-fund
      - name: Make the demo's data
        run: npm run --if-present demo:fixtures
      - name: List the open-source licences
        run: npm run licences
      - name: Generate the iOS project (and its pods)
        run: npx expo prebuild --platform ios --clean
      - name: Build the app, unsigned
        working-directory: mobile/ios
        run: |
          workspace=$(ls -d ./*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
      - name: Pack the .ipa
        run: |
          app=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry edunex-plus-demo.ipa Payload)
          du -h "$RUNNER_TEMP/ipa/edunex-plus-demo.ipa"
      - name: Upload the .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edunex-plus-demo-ipa
          path: ${{ runner.temp }}/ipa/edunex-plus-demo.ipa
          if-no-files-found: error
          retention-days: 14
