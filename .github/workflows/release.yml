# The installable app for macOS, Windows and Linux.
#
# - On a version tag (v1.2.3): checks that the tag matches package.json's
#   version, builds all three, and puts them in a DRAFT release with notes
#   written from the merged pull requests (.github/release.yml groups them).
#   You publish the draft by hand after trying it on real accounts; only then
#   does the app's once-a-day update check see the new version. Once SignPath
#   is set up (docs/code-signing.md), the Windows installers are signed on the
#   way, and the job waits for you to approve each signing in SignPath.
# - On pushes to main that touch packaging, and by hand from a branch (Actions →
#   Package and release → Run workflow): builds all three as a check, keeps
#   them for a week on the run's page, and publishes nothing.
name: Package and release

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    # Pushes to main only build when packaging could have changed. (GitHub
    # doesn't apply this list to tags: every version tag builds.)
    paths:
      - "electron-builder.config.mjs"
      - "scripts/package-fuses.mjs"
      - "scripts/package-sign.mjs"
      - "scripts/package-sign-win.mjs"
      - "scripts/package-win.mjs"
      - "scripts/package-mac-update.mjs"
      - "scripts/package-zip-win.mjs"
      - "scripts/update-info.mjs"
      - "scripts/build-desktop.mjs"
      - "scripts/desktop-bundle.mjs"
      - "scripts/adhoc-sign-electron.mjs"
      - "src/desktop/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches package.json's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG doesn't match package.json's version ($version). The app compares the two to offer updates: run \`npm version <new-version>\` and push that commit and its tag instead."
            exit 1
          fi
          echo "Tag $TAG matches package.json."

  package:
    name: package (${{ matrix.name }})
    needs: verify
    # verify only runs for tags; elsewhere it's skipped and packaging goes ahead.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
          - name: Windows
            os: windows-latest
            target: win
          - name: Linux
            os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # A signed Windows release waits for two approvals in SignPath.
    timeout-minutes: ${{ matrix.target == 'win' && 120 || 30 }}
    permissions:
      contents: read
      actions: read # SignPath reads this run and downloads what it signs with the job's token
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and packages
        uses: ./.github/actions/setup
        with:
          # Release builds start from a clean download, never from a shared cache.
          cache: "false"
      # The project's own certificate for the Mac app, from the repository's secrets, in a keychain
      # of its own that lasts this job: signed with it, every release is the same app to macOS, so
      # updating doesn't make the keychain ask the Student for their password
      # (scripts/package-sign.mjs; scripts/make-signing-cert.mjs makes one). Without the secrets
      # (forks, or before they're set) the app is signed ad-hoc, as it always was.
      - name: Get the signing certificate ready (macOS)
        id: signing
        if: matrix.target == 'mac'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGNING_P12" ] || [ -z "$MAC_SIGNING_PASSWORD" ]; then
            echo "No MAC_SIGNING_P12 and MAC_SIGNING_PASSWORD secrets: the Mac app is signed ad-hoc."
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning::This release's Mac app is signed ad-hoc: after updating to it, macOS asks Students for their password again. Set the signing secrets (CONTRIBUTING.md, Packaged builds)."
            fi
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/signing.p12"
          trap 'rm -f "$p12"' EXIT
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          # From here on "Remove the signing certificate" deletes it, even if this step fails.
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          # Never locks by itself while the job runs.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a dialog nobody could click.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
      # The Windows installers are signed by SignPath Foundation, free for open-source projects
      # (docs/code-signing.md). It signs on its own servers, so a signed build takes two passes
      # (scripts/package-win.mjs, scripts/package-sign-win.mjs): the app's own programs and the
      # uninstallers are signed first, then the installers made from them. Releases are signed
      # once the SignPath settings exist; without them a release is unsigned, as before. This
      # workflow's other builds (main, or started by hand) take the same two passes, folders and
      # checks with a stand-in signature; only the trip to SignPath and back is left for releases.
      - name: Choose how the Windows installers are signed (Windows)
        id: windows-signing
        if: matrix.target == 'win'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          version=$(node -p 'require("./package.json").version')
          {
            echo "version=$version"
            # As Windows numbers it in the app's own program: electron-builder writes major.minor.patch.0.
            echo "windows-version=${version%%[-+]*}.0"
          } >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "way=stand-in" >> "$GITHUB_OUTPUT"
            echo "Not a release: the Windows installers get a stand-in signature, to try the way a signed release is built."
          elif [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "way=signpath" >> "$GITHUB_OUTPUT"
            echo "A release: SignPath signs the Windows installers. Approve each signing request in SignPath when it emails you."
          else
            echo "way=none" >> "$GITHUB_OUTPUT"
            echo "::warning::This release's Windows installers aren't signed: Windows and the browser warn about them, and Smart App Control blocks them. Set up SignPath (docs/code-signing.md)."
          fi
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          # electron-builder signs the Mac app ad-hoc (electron-builder.config.mjs) and doesn't
          # look for certificates; with this keychain, scripts/package-sign.mjs signs it again.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAC_SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          WINDOWS_SIGNING: ${{ steps.windows-signing.outputs.way }}
        run: |
          if [ "$TARGET" != win ]; then
            npm run "package:$TARGET" -- --publish never
          elif [ "$WINDOWS_SIGNING" = none ]; then
            npm run package:win
          else
            # Pass 1: the installers, and in release/to-sign the programs to sign first.
            npm run package:win -- --to-sign release/to-sign
          fi
      # The same Mac app as each zip, packed about a third smaller for updating: a .tar.xz beside it, in
      # latest-mac.yml with its sha512, checked to unpack to the signed app
      # (scripts/package-mac-update.mjs). The zip stays: copies up to 0.1.0-alpha.16 update only from it.
      - name: Pack the Mac update smaller (macOS)
        if: matrix.target == 'mac'
        run: node scripts/package-mac-update.mjs release
      # Run by hand: the programs to sign, as they are before signing, for checking SignPath's
      # artifact configuration against (scripts/setup-windows-signing.sh).
      - name: Keep a sample of what SignPath signs first (Windows, run by hand)
        if: steps.windows-signing.outputs.way == 'stand-in' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-programs-sample
          path: release/to-sign
          if-no-files-found: error
          retention-days: 3
      # Not a release: a certificate made for this run stands in for SignPath's, and what it signs goes
      # to the folders SignPath's would come back to. Windows trusts it on this runner only, so the
      # checks below can ask for a valid signature either way.
      - name: Make a stand-in signing certificate (Windows)
        id: stand-in
        if: steps.windows-signing.outputs.way == 'stand-in'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Edunex Plus stand-in, not trusted anywhere else' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $public = Join-Path $env:RUNNER_TEMP 'stand-in.cer'
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Sign the app's programs with the stand-in (Windows)
        if: steps.windows-signing.outputs.way == 'stand-in'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.stand-in.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMBPRINT"
          Copy-Item release/to-sign release/signed-programs -Recurse
          foreach ($file in Get-ChildItem release/signed-programs -Filter *.exe) {
            $signed = Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256
            if ($signed.Status -ne 'Valid') { throw "$($file.Name): $($signed.Status) $($signed.StatusMessage)" }
          }
      - name: Send the app's programs to SignPath (Windows)
        id: programs-to-sign
        if: steps.windows-signing.outputs.way == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-programs-to-sign
          path: release/to-sign
          if-no-files-found: error
          retention-days: 1
      - name: Sign the app's programs (Windows; approve it in SignPath)
        if: steps.windows-signing.outputs.way == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'edunex-plus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-programs
          github-artifact-id: ${{ steps.programs-to-sign.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.windows-signing.outputs.version }}"
            windowsVersion: "${{ steps.windows-signing.outputs.windows-version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: release/signed-programs
      - name: Make the installers from the signed programs (Windows)
        if: matrix.target == 'win' && steps.windows-signing.outputs.way != 'none'
        run: node scripts/package-win.mjs --signed release/signed-programs
      - name: Sign the installers with the stand-in (Windows)
        if: steps.windows-signing.outputs.way == 'stand-in'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.stand-in.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMBPRINT"
          New-Item release/signed-installers -ItemType Directory -Force | Out-Null
          Copy-Item release/*.exe release/signed-installers
          foreach ($file in Get-ChildItem release/signed-installers -Filter *.exe) {
            $signed = Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256
            if ($signed.Status -ne 'Valid') { throw "$($file.Name): $($signed.Status) $($signed.StatusMessage)" }
          }
      - name: Send the installers to SignPath (Windows)
        id: installers-to-sign
        if: steps.windows-signing.outputs.way == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers-to-sign
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Sign the installers (Windows; approve it in SignPath)
        if: steps.windows-signing.outputs.way == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'edunex-plus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.installers-to-sign.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.windows-signing.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: release/signed-installers
      - name: Put the signed installers in place (Windows)
        if: matrix.target == 'win' && steps.windows-signing.outputs.way != 'none'
        run: cp release/signed-installers/*.exe release/
      # Signing changed the installers' bytes: the app's updater checks a download against the
      # sha512 in latest*.yml (src/desktop/self-update.ts), so it has to be the signed file's.
      - name: Write the signed installers' sha512 into the update info (Windows)
        if: matrix.target == 'win' && steps.windows-signing.outputs.way != 'none'
        run: node scripts/update-info.mjs release
      - name: Check the signatures (Windows)
        if: matrix.target == 'win' && steps.windows-signing.outputs.way != 'none'
        shell: pwsh
        env:
          WAY: ${{ steps.windows-signing.outputs.way }}
          THUMBPRINT: ${{ steps.stand-in.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ours = @(Get-ChildItem release -Filter *.exe) + @(Get-Item 'release/win-unpacked/Edunex Plus.exe', 'release/win-arm64-unpacked/Edunex Plus.exe')
          $rows = foreach ($file in $ours) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $signer = $signature.SignerCertificate
            $byUs = if ($env:WAY -eq 'signpath') { $signer.Subject -like '*CN=SignPath Foundation*' } else { $signer.Thumbprint -eq $env:THUMBPRINT }
            $name = [IO.Path]::GetRelativePath($PWD, $file.FullName)
            if ($signature.Status -ne 'Valid' -or -not $byUs) { throw "$name isn't signed as it should be: $($signature.Status), $($signer.Subject)" }
            "| $name | $($signer.Subject) |"
          }
          # Still the build pass 1 checked: signing must leave Electron's security switches as they were.
          foreach ($app in 'release/win-unpacked/Edunex Plus.exe', 'release/win-arm64-unpacked/Edunex Plus.exe') {
            node scripts/package-fuses.mjs $app
            if ($LASTEXITCODE -ne 0) { throw "The fuses changed in $app." }
          }
          $shipped = (Get-ChildItem release/win-unpacked -Filter *.dll | ForEach-Object { $_.Name }) -join ', '
          @("### Windows signatures ($env:WAY)", '', '| File | Signed by |', '|---|---|') + $rows + @('', "Electron's own DLLs ship as Electron made them: $shipped.") | Add-Content $env:GITHUB_STEP_SUMMARY
      # Each installer, final now (signed or not), also in a zip of its own (scripts/package-zip-win.mjs),
      # then opened with Windows' own zip reader: it must hold exactly the installer beside it.
      - name: Zip each installer (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/package-zip-win.mjs release
          if ($LASTEXITCODE -ne 0) { throw 'The installers were not zipped.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zips = @(Get-ChildItem release -Filter '*-windows-*.zip')
          if ($zips.Count -ne 2) { throw "$($zips.Count) zips in release/, not one per installer." }
          foreach ($zip in $zips) {
            $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
            try {
              if ($archive.Entries.Count -ne 1) { throw "$($zip.Name) holds $($archive.Entries.Count) files, not one." }
              $entry = $archive.Entries[0]
              $stream = $entry.Open()
              try { $inside = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash } finally { $stream.Dispose() }
              if ($inside -ne (Get-FileHash "release/$($entry.FullName)" -Algorithm SHA256).Hash) { throw "$($zip.Name) doesn't hold the $($entry.FullName) beside it." }
              "$($zip.Name) holds $($entry.FullName), $($zip.Length) bytes."
            } finally { $archive.Dispose() }
          }
      - name: Remove the signing certificate (macOS)
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"
      # The helper that lists and opens the apps for a file runs for real only on Windows.
      - name: List the apps that open a file (Windows)
        if: matrix.target == 'win'
        run: npx vitest run test/desktop/open-with.test.ts
      # The AppImage as Students download it, on this runner's Ubuntu 24.04 as it comes: it doesn't
      # let an AppImage start Chromium's sandbox, so the AppImage's launcher must see that and start
      # the app without it. The app must know the file it runs from (APPIMAGE): it replaces that file
      # when it updates itself (src/desktop/updater.ts).
      - name: Start the AppImage (Linux)
        if: matrix.target == 'linux'
        run: |
          # fuse3 comes with every Ubuntu desktop since 22.04; the AppImage needs nothing more.
          missing=()
          command -v xvfb-run > /dev/null || missing+=(xvfb)
          command -v fusermount3 > /dev/null || missing+=(fuse3)
          if (( ${#missing[@]} )); then sudo apt-get update && sudo apt-get install -y "${missing[@]}"; fi
          appimage=$(realpath release/Edunex-Plus-*-x86_64.AppImage)
          timeout 25 xvfb-run --auto-servernum "$appimage" &
          started=$!
          sleep 15
          pid=$(pgrep -o -x edunex-plus) || { echo "::error::The AppImage closed by itself instead of staying open."; exit 1; }
          if ! grep -qzxF "APPIMAGE=$appimage" "/proc/$pid/environ"; then
            echo "::error::The app doesn't know the AppImage it runs from, so it couldn't update itself."
            exit 1
          fi
          started_as=$(tr '\0' ' ' < "/proc/$pid/cmdline")
          # Still running after 25 seconds (timeout's 124) means it opened and stayed open.
          status=0
          wait "$started" || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::The AppImage closed by itself (exit $status) instead of staying open."
            exit 1
          fi
          # One copy at a time: the next step's would hand over to this one and close.
          pkill -x edunex-plus || true
          for _ in $(seq 20); do pgrep -x edunex-plus > /dev/null || break; sleep 1; done
          echo "The AppImage opened and stayed open, started as: $started_as"
      - name: Start the packaged app (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
          # Still running after 25 seconds (timeout's 124) means it opened and stayed open.
          status=0
          timeout 25 xvfb-run --auto-servernum release/linux-unpacked/edunex-plus || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::The packaged app closed by itself (exit $status) instead of staying open."
            exit 1
          fi
          echo "The packaged app opened and stayed open."
      # With them, the update info files (latest-mac.yml, latest.yml, latest-linux*.yml): the
      # sha512 of each file the app downloads when it updates itself, which it checks before
      # installing (src/desktop/self-update.ts).
      - name: Keep the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.tar.xz
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}
          compression-level: 0
      # Nobody on the team runs Windows, so this runner installs the new
      # installer the way Students will: over the first alpha's step-by-step
      # install ("only for me", as its guide said), where it must replace that
      # copy in its folder; then uninstalls it, which must keep their data;
      # then over the alpha installed for everyone, where it must stop (code 2)
      # rather than add a second copy. Silent (/S), so no window waits for a click.
      - name: Install over the first alpha, then uninstall (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WINDOWS_SIGNING: ${{ steps.windows-signing.outputs.way }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Install([string]$exe, [string[]]$switches) {
            # -Wait also waits for what it starts, like an uninstaller's copy of itself.
            (Start-Process -FilePath $exe -ArgumentList $switches -Wait -PassThru).ExitCode
          }
          function Gone([string]$path) {
            for ($i = 0; $i -lt 60 -and (Test-Path $path); $i++) { Start-Sleep -Seconds 1 }
            -not (Test-Path $path)
          }
          $new = (Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1).FullName
          if (-not $new) { throw 'No installer in release/.' }
          # A failed download doesn't stop the script by itself (gh is a program, not a PowerShell command).
          # Without the first alpha there's nothing to install over: say so, and don't hold the release up.
          gh release download v0.1.0-alpha.1 --repo $env:REPO --pattern '*.exe' --dir "$env:RUNNER_TEMP\alpha"
          $alpha = if ($LASTEXITCODE -eq 0) { (Get-ChildItem "$env:RUNNER_TEMP\alpha" -Filter '*.exe' | Select-Object -First 1).FullName }
          if (-not $alpha) {
            Write-Output '::warning::The first alpha (v0.1.0-alpha.1) or its Windows installer is gone, so updating over it was not tried.'
            exit 0
          }
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $old = Join-Path $programs 'Edunex Plus'

          Install $alpha '/S', '/currentuser' | Out-Null
          if (-not (Test-Path "$old\Edunex Plus.exe")) { throw 'The first alpha did not install.' }
          Set-Content "$old\left-by-the-test.txt" 'gone once the old copy is uninstalled'
          $code = Install $new '/S'
          if ($code -ne 0) { throw "The installer ended with code $code." }
          if (-not (Test-Path "$old\Edunex Plus.exe") -or (Test-Path "$old\left-by-the-test.txt")) { throw "The new version did not replace the old one in $old." }
          if (Test-Path (Join-Path $programs 'edunex-plus')) { throw 'It installed a second copy beside the old one.' }
          $listed = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like 'Edunex Plus*' })
          if ($listed.Count -ne 1) { throw "Installed apps lists Edunex Plus $($listed.Count) times." }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Edunex Plus.lnk")) { throw 'No Start menu shortcut.' }
          # A signed installer puts a signed app and a signed uninstaller in place: the next update runs that uninstaller.
          if ($env:WINDOWS_SIGNING -and $env:WINDOWS_SIGNING -ne 'none') {
            foreach ($file in "$old\Edunex Plus.exe", "$old\Uninstall Edunex Plus.exe") {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid') { throw "$file isn't signed: $($signature.Status) $($signature.StatusMessage)" }
            }
          }

          $data = Join-Path $env:APPDATA 'Edunex Plus'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\saved.txt" 'the Student''s data'
          Install "$old\Uninstall Edunex Plus.exe" '/S' | Out-Null
          if (-not (Gone "$old\Edunex Plus.exe")) { throw 'Uninstalling left the app in place.' }
          if (-not (Test-Path "$data\saved.txt")) { throw 'Uninstalling deleted the Student''s data.' }

          Install $alpha '/S', '/allusers' | Out-Null
          if (-not (Test-Path "$env:ProgramFiles\Edunex Plus\Edunex Plus.exe")) { throw 'The first alpha did not install for everyone.' }
          $code = Install $new '/S'
          if ($code -ne 2) { throw "Over a copy installed for everyone, the installer ended with code $code instead of stopping (2)." }
          if ((Test-Path "$old\Edunex Plus.exe") -or (Test-Path "$programs\edunex-plus\Edunex Plus.exe")) { throw 'It installed a second copy anyway.' }

          "### Windows installer`n`nReplaced the first alpha in its folder, kept the Student's data when uninstalled, and stopped over a copy installed for everyone." | Add-Content $env:GITHUB_STEP_SUMMARY

  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and attach the installers
    steps:
      - name: Collect the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: installers
          merge-multiple: true
      - name: Write each file's SHA-256 checksum
        # SHA256SUMS.txt goes on the release beside the installers, so a student can check that
        # a download is the file this workflow built (docs/install.md, "Check a download").
        working-directory: installers
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.tar.xz *.exe *.deb *.AppImage)
          if (( ${#files[@]} == 0 )); then echo "No installers to sum" >&2; exit 1; fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Put them in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # A re-run: refresh the files on the release that already exists.
            gh release upload "$TAG" --repo "$REPO" --clobber installers/*
          else
            # Above the notes GitHub writes: how to install, and how the installers are signed.
            intro="How to install: [install guide](https://github.com/$REPO/blob/main/docs/install.md). How the installers are signed: [code signing policy](https://github.com/$REPO/blob/main/docs/code-signing.md)."
            flags=(--draft --generate-notes --notes "$intro" --verify-tag --title "Edunex Plus ${TAG#v}")
            # v0.1.0-alpha.1 and the like are pre-releases: only copies that are
            # pre-releases themselves offer them (src/engine/updates.ts).
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$REPO" "${flags[@]}" installers/*
          fi
          {
            echo "### Draft release ready"
            echo
            echo "**$TAG** is a draft with the installers for macOS, Windows and Linux. Try it on real accounts, then publish it from the Releases page; installed apps see it only once it's published."
          } >> "$GITHUB_STEP_SUMMARY"
