# The phone app for a release: the Android APK and the iPhone .ipa students install (docs/install.md, "Android" and
# "iPhone"). The real app, not a QA build: no read-only guard (EXPO_PUBLIC_R3_GUARD) and no demo.
#
# - Called by release.yml on a version tag: both files go on the draft release beside the desktop installers,
#   as artifacts app-android and app-iphone (release.yml collects every app-*).
# - By hand (Actions → Phone app for a release → Run workflow): builds both as a check, kept for a week on the run's page.
#
# The APK is signed with Edunex Plus's own key (the ANDROID_SIGNING_* secrets, mobile/plugins/release-signing.js;
# docs/code-signing.md, "Android"), the same on every release, so a new version installs over the one before and a
# file signed by anyone else can't. Without the key the build stops: a release is never signed with a public key.
# The .ipa is unsigned: each student signs it with their own Apple ID when
# they install it (Sideloadly), since a free Apple ID can't sign for anyone else.
name: Phone app for a release

on:
  workflow_call:
    secrets:
      ANDROID_SIGNING_KEYSTORE:
        description: Edunex Plus's Android signing key (a PKCS12 keystore, base64).
        required: true
      ANDROID_SIGNING_PASSWORD:
        description: The keystore's password.
        required: true
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No caches in a release build: what goes on the release is built from scratch (as release.yml's).
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Install the phone app's packages
        run: npm ci --no-audit --no-fund
      - name: Install the NDK React Native asks for
        # Gradle would download it itself, but a broken download there fails the build: here it's tried again.
        run: |
          ndk=$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          [ -n "$ndk" ] || { echo "::error::Couldn't read React Native's NDK version."; exit 1; }
          [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ] && { echo "NDK $ndk is already there."; exit 0; }
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null && exit 0
            echo "::warning::Downloading NDK $ndk failed (try $attempt of 3)."
            rm -rf "$ANDROID_HOME/ndk/$ndk"
          done
          exit 1
      - name: Make the demo's data
        # As mobile.yml's builds do: Metro resolves the demo's files even in the real app, which leaves them out.
        run: npm run --if-present demo:fixtures
      - name: List the open-source licences
        run: npm run licences
      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Tune Gradle
        working-directory: mobile/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # The generated file has no newline at its end.
          {
            echo
            echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'org.gradle.parallel=true'
          } >> gradle.properties
      - name: Get the signing key ready
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No ANDROID_SIGNING_KEYSTORE secret: a release APK is never signed with the template's public key (docs/code-signing.md, \"Android\")."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        # Phones only: 64-bit ARM (nearly every phone) and 32-bit ARM (older ones).
        working-directory: mobile/android
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Check it carries Edunex Plus's key
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ours=$(keytool -list -keystore "$ANDROID_SIGNING_KEYSTORE_FILE" -storepass "$ANDROID_SIGNING_PASSWORD" -alias edunex-plus | sed -n 's/.*SHA-256): //p' | tr -d ':' | tr 'A-F' 'a-f')
          signed=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [ -n "$ours" ] && [ "$ours" = "$signed" ] || { echo "::error::The APK isn't signed with Edunex Plus's key."; exit 1; }
          echo "Signed with Edunex Plus's key ($signed)."
      - name: Name the APK
        run: |
          version=$(node -p 'require("../package.json").version')
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/Edunex-Plus-$version-android.apk"
      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 7

  iphone:
    name: iphone
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No caches in a release build: what goes on the release is built from scratch (as release.yml's).
          package-manager-cache: false
      - name: Install the phone app's packages
        run: npm ci --no-audit --no-fund
      - name: Make the demo's data
        run: npm run --if-present demo:fixtures
      - name: List the open-source licences
        run: npm run licences
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build the app, unsigned
        run: |
          xcodebuild -workspace ios/*.xcworkspace -scheme "$(basename ios/*.xcworkspace .xcworkspace)" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
      - name: Pack the .ipa
        run: |
          version=$(node -p 'require("../package.json").version')
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/out"
          cp -R build/Build/Products/Release-iphoneos/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/Edunex-Plus-$version-iphone.ipa" Payload)
      - name: Keep the .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-iphone
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 7
