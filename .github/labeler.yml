# Which labels a pull request gets from the files it changes
# (.github/workflows/labels.yml), so its list says at a glance what it touches.

"area:app":
  - changed-files:
      - any-glob-to-any-file: ["src/app/**", "src/core/strings/**"]

"area:engine":
  - changed-files:
      - any-glob-to-any-file: ["src/engine/**"]
  - changed-files:
      - all-globs-to-any-file: ["src/core/**", "!src/core/strings/**"]

"area:desktop":
  - changed-files:
      - any-glob-to-any-file:
          - "src/desktop/**"
          - "electron-builder.config.mjs"
          - "scripts/build-desktop.mjs"
          - "scripts/desktop-bundle.mjs"
          - "scripts/package-fuses.*"
          - "scripts/package-sign.*"
          - "scripts/make-signing-cert.*"
          - "scripts/adhoc-sign-electron.mjs"
          - "assets/**"

# The phone app (Android and iPhone), its tests and the workflows that build it.
"area:mobile":
  - changed-files:
      - any-glob-to-any-file:
          - "mobile/**"
          - "test/mobile/**"
          - "scripts/ci/mobile-e2e.sh"
          - ".github/workflows/mobile.yml"
          - ".github/workflows/mobile-release.yml"

# The public website.
"area:site":
  - changed-files:
      - any-glob-to-any-file: ["site/**", ".github/workflows/pages.yml"]

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "relay/**"
          - "scripts/ci/**"
          - "scripts/check-bundle-size.mjs"
          - "biome.json"
          - "knip.json"
          - ".nvmrc"

documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["test/**"]

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["package.json", "package-lock.json"]

# Sessions, tokens, the window's locks and the bridge to it, packaging switches,
# the Mac app's signature, the workflows that hold the repository's keys, the
# report relay, which holds Students' reports and a token for the issues, and on
# the phone: its sessions and sign-in, the APK's signing key, the in-app update
# that installs a downloaded APK, and the permissions the app asks for: worth a
# careful look.
security-sensitive:
  - changed-files:
      - any-glob-to-any-file:
          - "src/desktop/**"
          - "relay/**"
          - "src/core/actions/**"
          - "electron-builder.config.mjs"
          - "scripts/package-fuses.*"
          - "scripts/package-sign.*"
          - "scripts/make-signing-cert.*"
          - ".github/workflows/**"
          - "mobile/app.config.ts"
          - "mobile/plugins/release-signing.js"
          - "mobile/src/host/apk-update.ts"
          - "mobile/src/host/apk-files.ts"
          - "mobile/src/host/vault.ts"
          - "mobile/src/host/transport.ts"
          - "mobile/src/host/signed-pages.ts"
          - "mobile/src/host/resignin.ts"
          - "mobile/src/host/guard.ts"
          - "mobile/src/shell/sign-in.tsx"
          - "mobile/modules/web-cookies/**"
