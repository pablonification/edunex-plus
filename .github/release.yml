# How GitHub groups the notes of a release (the draft the release workflow
# makes). Labels come from .github/labeler.yml; bug and enhancement are set by hand.
changelog:
  categories:
    - title: New
      labels: [enhancement]
    - title: Fixed
      labels: [bug]
    # Before the desktop's groups: a pull request goes in the first group that matches, and one that changes the
    # phone app is listed with the phone app, even when it touches shared screens or words too.
    - title: Phone app (Android and iPhone)
      labels: ["area:mobile"]
    - title: Screens and words
      labels: ["area:app"]
    - title: Reading Edunex, SIX and ITB; alerts
      labels: ["area:engine"]
    - title: Desktop, sign-in and installers
      labels: ["area:desktop"]
    - title: Package updates
      labels: [dependencies]
    - title: Behind the scenes
      labels: ["area:ci", "area:site", tests, documentation]
    - title: Other changes
      labels: ["*"]
