# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is an outside reviewer on this repo. Pull requests here are often stacked (each one
# based on the branch of the one before), so it reviews every pull request, whatever its base,
# not only those into main. Biome, the tests and CI stay the gate; its notes are advice.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    - "!package-lock.json"
    - "!**/*.png"
